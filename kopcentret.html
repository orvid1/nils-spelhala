<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mörka köpcentret</title>
<style>
  :root { --bg:#0b0820; --neon:#00e5ff; --pink:#ff3df0; --gold:#ffd23f; --green:#45ff8a; --red:#ff4d6d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden;
    font-family:'Trebuchet MS', system-ui, sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas#c { display:block; width:100vw; height:100vh; }

    background:var(--green); color:#0b0820; box-shadow:0 5px 0 #1b9c4e; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #1b9c4e; }
  .btn.alt { background:var(--neon); box-shadow:0 5px 0 #0089a0; }

</style>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

// ===== Karta (i rutor) =====
const MW = 36, MH = 26;
const SHOPS = [
  { name:'Mataffären', sign:'🛒', x0:0,  y0:0,  x1:12, y1:9,  door:[6,9],   floor:'#cfe8cf', shelves:true,
    items:[['🥛','Mjölk'],['🍌','Bananer'],['🧀','Ost'],['🥚','Ägg'],['🍝','Pasta'],['🥕','Morötter'],['🍎','Äpplen'],['🧈','Smör'],['🧻','Toapapper'],['🥒','Gurka']] },
  { name:'Apoteket', sign:'💊', x0:12, y0:0,  x1:20, y1:9,  door:[16,9],  floor:'#d8f0ea', shelves:true,
    items:[['🩹','Plåster'],['🪥','Tandborste'],['🧴','Solkräm'],['💊','Vitaminer'],['🧼','Tvål']] },
  { name:'Leksaker', sign:'🧸', x0:20, y0:0, x1:28, y1:9, door:[24,9], floor:'#f5d9ef', shelves:true,
    items:[['🧸','Nalle'],['🎲','Tärningar'],['🪀','Jojo'],['🧩','Pussel'],['🎈','Ballonger']] },
  { name:'Elektronik', sign:'🔌', x0:28, y0:0,  x1:35, y1:9,  door:[31,9],  floor:'#d9dcf5', shelves:true,
    items:[['🔋','Batterier'],['💡','Glödlampa'],['🎧','Hörlurar'],['🔌','Sladd']] },
  { name:'Kläder', sign:'👕', x0:0,  y0:16, x1:10, y1:25, door:[5,16],  floor:'#f5e3cf', shelves:true,
    items:[['🧦','Strumpor'],['🧢','Keps'],['🧤','Vantar'],['👕','T-shirt'],['🧣','Halsduk']] },
  { name:'Kiosken', sign:'🌭', x0:10, y0:16, x1:20, y1:25, door:[14,16], floor:'#fff1c2', shelves:false, items:[] },
  { name:'Toaletten', sign:'🚽', x0:20, y0:16, x1:25, y1:25, door:[22,16], floor:'#dff3ff', shelves:false, items:[] },
  { name:'Sport', sign:'⚽', x0:25, y0:16, x1:35, y1:25, door:[30,16], floor:'#e1f5d0', shelves:true,
    items:[['⚽','Fotboll'],['🎾','Tennisbollar'],['🏓','Pingisbollar'],['🪁','Drake'],['🕶️','Solglasögon']] },
];
const BOO_LINES = ['BÖÖ!', 'Stanna och lek...', 'Du får aldrig gå hem!', 'Jag ser dig...', 'Vill du prova kläder?!'];
const CHARGER = { x:34, y:8 };
const TOILETS = [[21, 21], [24, 21], [21, 24], [24, 24]];

const grid = [], room = [], slotPos = [];
for (let y = 0; y < MH; y++) { grid.push(new Array(MW).fill(0)); room.push(new Array(MW).fill(-1)); }
SHOPS.forEach((s, id) => {
  for (let y = s.y0; y <= s.y1; y++) for (let x = s.x0; x <= s.x1; x++) {
    if (x === s.x0 || x === s.x1 || y === s.y0 || y === s.y1) grid[y][x] = 1; else room[y][x] = id;
  }
});
for (let y = 10; y <= 15; y++) { grid[y][0] = 1; grid[y][MW - 1] = 1; }
grid[12][0] = 3; grid[13][0] = 3; // utgången
SHOPS.forEach(s => { grid[s.door[1]][s.door[0]] = 0; grid[s.door[1]][s.door[0] + 1] = 0; });
SHOPS.forEach((s, id) => {
  slotPos[id] = [];
  if (!s.shelves) return;
  [s.y0 + 3, s.y0 + 6].forEach(sy => {
    for (let x = s.x0 + 2; x <= s.x1 - 2; x++) grid[sy][x] = 2;
    for (let x = s.x0 + 2; x <= s.x1 - 2; x += 2) { slotPos[id].push([x, sy - 1, 1]); slotPos[id].push([x, sy + 1, -1]); }
  });
});
for (let x = 12; x <= 18; x++) grid[20][x] = 2; // kioskdisk
grid[23][13] = 2; grid[23][17] = 2;
TOILETS.forEach(([x, y]) => grid[y][x] = 4);

// ===== Hjälpfunktioner =====
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
function loadSave() { try { return JSON.parse(localStorage.getItem('nils_kopcentret_v1')) || {}; } catch (e) { return {}; } }
function storeSave(d) { try { localStorage.setItem('nils_kopcentret_v1', JSON.stringify(d)); } catch (e) {} }
let allDoneFlag = false;
function solid(x, y) {
  const tx = Math.floor(x), ty = Math.floor(y);
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return true;
  const g = grid[ty][tx];
  return g === 1 || g === 2 || (g === 3 && !allDoneFlag);
}
const hits = (x, y, r) => solid(x - r, y - r) || solid(x + r, y - r) || solid(x - r, y + r) || solid(x + r, y + r);
function moveBody(o, dx, dy, r) {
  let bx = false, by = false;
  const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / .12) || 1;
  for (let i = 0; i < steps; i++) {
    if (!bx) { if (!hits(o.x + dx / steps, o.y, r)) o.x += dx / steps; else bx = true; }
    if (!by) { if (!hits(o.x, o.y + dy / steps, r)) o.y += dy / steps; else by = true; }
  }
  return { bx, by };
}
function lineOfSight(ax, ay, bx, by) {
  const n = Math.ceil(dist(ax, ay, bx, by) / .2);
  for (let i = 1; i < n; i++) {
    const g = grid[Math.floor(ay + (by - ay) * i / n)][Math.floor(ax + (bx - ax) * i / n)];
    if (g === 1 || g === 2) return false;
  }
  return true;
}

// ===== Ljud =====
let AC = null;
function beep(f, dur = .12, type = 'square', vol = .08, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, f + slide), AC.currentTime + dur);
    g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  pick() { beep(660, .08); setTimeout(() => beep(990, .12), 70); },
  hit() { beep(180, .25, 'sawtooth', .1, -120); },
  creak() { beep(90, .9, 'sawtooth', .06, -40); },
  step(v) { beep(1600, .03, 'square', v); setTimeout(() => beep(1100, .03, 'square', v * .7), 60); },
  heart() { beep(55, .12, 'sine', .25); setTimeout(() => beep(50, .12, 'sine', .2), 160); },
  scream() { beep(900, .5, 'sawtooth', .14, -600); beep(1250, .4, 'square', .07, -900); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .2, 'triangle', .1), i * 130)); },
  lose() { [400, 300, 200].forEach((f, i) => setTimeout(() => beep(f, .25, 'sawtooth', .08), i * 180)); },
};

// ===== 3D-värld =====
const T = 2, WALL_H = 3.2, EYE = 1.55;
const cv = $('c');
const renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 3, 24);
const camera = new THREE.PerspectiveCamera(72, 1, .05, 100);
camera.rotation.order = 'YXZ';
scene.add(camera);
const amb = new THREE.AmbientLight(0x6a5a99, .5);
scene.add(amb);
const flash = new THREE.SpotLight(0xfff0cc, 30, 20, .5, .45, 1);
flash.position.set(.25, -.25, 0);
flash.target.position.set(0, -.3, -1);
camera.add(flash); camera.add(flash.target);
function lockMouse() { try { const r = cv.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const texCache = {};
function emojiTex(e) {
  if (texCache[e]) return texCache[e];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.font = '100px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(e, 64, 72);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return texCache[e] = t;
}
function sprite(e, s = 1) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:emojiTex(e), transparent:true }));
  sp.scale.set(s, s, s); return sp;
}
function signMesh(text) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(25,8,50,.95)'; x.fillRect(0, 0, 512, 128);
  x.strokeStyle = '#ff3df0'; x.lineWidth = 8; x.strokeRect(4, 4, 504, 120);
  x.font = 'bold 60px "Trebuchet MS","Segoe UI Emoji",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = '#ff3df0'; x.shadowBlur = 18; x.fillStyle = '#ffd6fb'; x.fillText(text, 256, 68);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(2.6, .65), new THREE.MeshBasicMaterial({ map:t, transparent:true }));
}

// Statisk värld: väggar, hyllor, golv, tak, skyltar
(function buildStatic() {
  const walls = [], shelves = [], floors = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const g = grid[y][x];
    if (g === 1) walls.push([x, y]); else if (g === 2) shelves.push([x, y]);
    if (g !== 1) floors.push([x, y]);
  }
  const m4 = new THREE.Matrix4();
  const wallMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(T, WALL_H, T),
    new THREE.MeshStandardMaterial({ color:0x8a7fa3, roughness:.95 }), walls.length);
  walls.forEach(([x, y], i) => wallMesh.setMatrixAt(i, m4.makeTranslation((x + .5) * T, WALL_H / 2, (y + .5) * T)));
  scene.add(wallMesh);
  const shelfMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(T * .98, 1.8, T * .75),
    new THREE.MeshStandardMaterial({ color:0x7a5535, roughness:.8 }), shelves.length);
  shelves.forEach(([x, y], i) => {
    const h = room[y][x] === 5 ? 1.1 : 1.8;
    shelfMesh.setMatrixAt(i, m4.compose(new THREE.Vector3((x + .5) * T, h / 2, (y + .5) * T), new THREE.Quaternion(), new THREE.Vector3(1, h / 1.8, 1)));
  });
  scene.add(shelfMesh);
  const floorGeo = new THREE.PlaneGeometry(T, T); floorGeo.rotateX(-Math.PI / 2);
  const floorMesh = new THREE.InstancedMesh(floorGeo, new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.6 }), floors.length);
  const col = new THREE.Color();
  floors.forEach(([x, y], i) => {
    floorMesh.setMatrixAt(i, m4.makeTranslation((x + .5) * T, 0, (y + .5) * T));
    const r = room[y][x];
    col.set(r >= 0 ? SHOPS[r].floor : ((x + y) % 2 ? '#bdb6a6' : '#aaa393'));
    floorMesh.setColorAt(i, col);
  });
  scene.add(floorMesh);
  const outside = new THREE.Mesh(new THREE.PlaneGeometry(12, 14), new THREE.MeshStandardMaterial({ color:0x333333 }));
  outside.rotation.x = -Math.PI / 2; outside.position.set(-6, -.01, 13 * T);
  scene.add(outside);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(MW * T, MH * T), new THREE.MeshStandardMaterial({ color:0x1c1828 }));
  ceil.rotation.x = Math.PI / 2; ceil.position.set(MW * T / 2, WALL_H, MH * T / 2);
  scene.add(ceil);
  SHOPS.forEach(s => {
    const m = signMesh(`${s.sign} ${s.name}`);
    const top = s.door[1] === 9;
    m.position.set((s.door[0] + 1) * T, 2.75, top ? 10 * T + .02 : 16 * T - .02);
    if (!top) m.rotation.y = Math.PI;
    scene.add(m);
  });
  const exitSign = signMesh('🚪 UTGÅNG');
  exitSign.rotation.y = Math.PI / 2; exitSign.position.set(T + .02, 2.75, 13 * T);
  scene.add(exitSign);
  TOILETS.forEach(([x, y]) => { const s = sprite('🚽', .9); s.position.set((x + .5) * T, .5, (y + .5) * T); scene.add(s); });
  [['🌭', 12], ['🍦', 15], ['🥤', 18]].forEach(([e, x]) => { const s = sprite(e, .6); s.position.set((x + .5) * T, 1.45, 20.5 * T); scene.add(s); });
  const ch = sprite('🔋', 1); ch.position.set((CHARGER.x + .5) * T, 1.1, (CHARGER.y + .5) * T); scene.add(ch);
  const chl = new THREE.PointLight(0x44ff88, 3, 5, 1); chl.position.set((CHARGER.x + .5) * T, 1.5, (CHARGER.y + .5) * T); scene.add(chl);
  const mom = sprite('👩', 1.3), dad = sprite('👨', 1.3), car = sprite('🚗', 2.2);
  mom.position.set(-1.2, 1.4, 12.4 * T); dad.position.set(-1.2, 1.4, 13.6 * T); car.position.set(-5, 1, 13 * T);
  scene.add(mom, dad, car);
})();

// Monster-modeller
const mannequinMat = new THREE.MeshStandardMaterial({ color:0xeadfcd, roughness:.5 });
const eyeMat = new THREE.MeshBasicMaterial({ color:0xff1a3a, fog:false });
function makeMannequin() {
  const g = new THREE.Group();
  const add = (geo, x, y, z, rz = 0) => { const m = new THREE.Mesh(geo, mannequinMat); m.position.set(x, y, z); m.rotation.z = rz; g.add(m); return m; };
  add(new THREE.CylinderGeometry(.2, .27, .95, 10), 0, 1.2, 0);
  add(new THREE.CylinderGeometry(.08, .06, .8, 8), -.11, .4, 0);
  add(new THREE.CylinderGeometry(.08, .06, .8, 8), .11, .4, 0);
  add(new THREE.CylinderGeometry(.06, .045, .8, 8), -.34, 1.2, 0, -.18);
  add(new THREE.CylinderGeometry(.06, .045, .8, 8), .34, 1.2, 0, .18);
  add(new THREE.CylinderGeometry(.06, .07, .15, 8), 0, 1.72, 0);
  const head = add(new THREE.SphereGeometry(.17, 14, 12), 0, 1.9, 0); head.scale.y = 1.25;
  [-.06, .06].forEach(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(.028, 8, 6), eyeMat); e.position.set(x, 1.93, .15); g.add(e); });
  return g;
}
function makeRobot() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0x9aa0aa, metalness:.5, roughness:.4 });
  const b = new THREE.Mesh(new THREE.CylinderGeometry(.45, .5, .45, 16), mat); b.position.y = .3; g.add(b);
  const d = new THREE.Mesh(new THREE.SphereGeometry(.3, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat); d.position.y = .52; g.add(d);
  [-.1, .1].forEach(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(.05, 8, 6), eyeMat); e.position.set(x, .65, .25); g.add(e); });
  return g;
}
function makeCart() {
  const g = new THREE.Group();
  const cage = new THREE.Mesh(new THREE.BoxGeometry(1.1, .6, .7), new THREE.MeshStandardMaterial({ color:0xb0b6c0, wireframe:true }));
  cage.position.y = .75; g.add(cage);
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.1, .05, .7), new THREE.MeshStandardMaterial({ color:0x777777 }));
  base.position.y = .45; g.add(base);
  const ghost = sprite('👻', 1); ghost.position.y = 1.6; ghost.material.opacity = .8; g.add(ghost); g.userData.ghost = ghost;
  return g;
}

// ===== Spelets tillstånd =====
let save0 = loadSave();
let level = 1, state = 'menu';
let p, yaw, pitch, bob, time, dayLen, battery, lives, list, slots, carts, robots, mannequins, puddles, shake, stun;
let blackout, nextBlackout, heartT, flow, flowT, hintT, exitDoor, exitLight;
const dyn = new THREE.Group(); scene.add(dyn);

function setupLevel() {
  while (dyn.children.length) dyn.remove(dyn.children[0]);
  allDoneFlag = false;
  slots = [];
  SHOPS.forEach((s, id) => {
    const pos = shuffle(slotPos[id].slice());
    s.items.forEach((it, i) => {
      const [tx, ty, dir] = pos[i];
      const sl = { tx, ty, e:it[0], name:it[1], shop:id, taken:false, sprite:sprite(it[0], .75) };
      sl.sprite.position.set((tx + .5) * T, 1.15, (ty + .5 - dir * .3) * T);
      dyn.add(sl.sprite); slots.push(sl);
    });
  });
  const n = Math.min(3 + level, 12);
  list = shuffle(slots.slice()).slice(0, n).map((s, i) => ({ slot:s, who:i % 2 ? 'pappa' : 'mamma', got:false }));
  slots.forEach(s => { if (!list.some(l => l.slot === s)) s.sprite.material.color.set(0x555555); });
  dayLen = Math.max(150, 240 - level * 15);
  time = 0; battery = 100; lives = 3; shake = 0; stun = 0; bob = 0; hintT = 0;
  blackout = 0; nextBlackout = rand(8, 12); heartT = 0; flowT = 0;
  p = { x:2.5, y:13, vx:0, vy:0 }; yaw = -Math.PI / 2; pitch = 0;
  puddles = [];
  carts = [];
  for (let i = 0; i < Math.min(level, 5); i++) {
    const c = { x:rand(8, 32), y:10.5 + (i * 2 + 1) % 6, vx:(Math.random() < .5 ? -1 : 1) * (2.6 + level * .3), cd:0, mesh:makeCart() };
    dyn.add(c.mesh); carts.push(c);
  }
  robots = [];
  for (let i = 0; i < Math.min(Math.ceil(level / 2), 3); i++) {
    const r = { x:rand(10, 30), y:12.5, tx:0, ty:0, drop:3, cd:0, mesh:makeRobot() };
    newRobotTarget(r); dyn.add(r.mesh); robots.push(r);
  }
  // Skyltdockorna ställer sig långt bort från start
  const far = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if ((grid[y][x] === 0 || grid[y][x] === 4) && dist(x, y, 2, 13) > 12) far.push([x, y]);
  shuffle(far);
  mannequins = far.slice(0, Math.min(1 + level, 7)).map(([x, y]) => {
    const m = { x:x + .5, y:y + .5, px:x + .5, py:y + .5, face:rand(0, 6), cd:2, stepT:0, seen:false, mesh:makeMannequin() };
    dyn.add(m.mesh); return m;
  });
  exitDoor = new THREE.Mesh(new THREE.BoxGeometry(.2, WALL_H, T * 2), new THREE.MeshStandardMaterial({ color:0x8a2030, emissive:0x400010 }));
  exitDoor.position.set(.1, WALL_H / 2, 13 * T); dyn.add(exitDoor);
  exitLight = null;
  computeFlow();
  renderList();
}
function newRobotTarget(r) { r.tx = rand(2, 34); r.ty = rand(10.5, 15.5); }
const allDone = () => list && list.every(l => l.got);

// Vägkarta så att skyltdockorna hittar runt hörn
function computeFlow() {
  flow = Array.from({ length:MH }, () => new Array(MW).fill(1e9));
  const sx = Math.floor(p.x), sy = Math.floor(p.y), q = [[sx, sy]];
  flow[sy][sx] = 0;
  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= MW || ny >= MH || flow[ny][nx] < 1e9) continue;
      const g = grid[ny][nx];
      if (g !== 0 && g !== 4) continue;
      flow[ny][nx] = flow[y][x] + 1; q.push([nx, ny]);
    }
  }
}

// ===== Styrning =====
const keys = {};
const isTouch = matchMedia('(pointer:coarse)').matches;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if ((e.key === 'Enter' || e.key === ' ') && state !== 'play') { const b = document.querySelector('#screen .btn'); if (b) b.click(); }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== cv) return;
  yaw -= e.movementX * .0022; pitch = clamp(pitch - e.movementY * .0022, -1.1, 1.1);
});
cv.addEventListener('click', () => { if (state === 'play' && !isTouch) lockMouse(); });
const joy = { on:false, id:null, ox:0, oy:0, x:0, y:0 }, look = { id:null, x:0, y:0 };
cv.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    if (t.clientX < innerWidth / 2 && !joy.on) { joy.on = true; joy.id = t.identifier; joy.ox = joy.x = t.clientX; joy.oy = joy.y = t.clientY; }
    else if (look.id === null) { look.id = t.identifier; look.x = t.clientX; look.y = t.clientY; }
  }
  e.preventDefault();
}, { passive:false });
cv.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) { joy.x = t.clientX; joy.y = t.clientY; }
    if (t.identifier === look.id) {
      yaw -= (t.clientX - look.x) * .006; pitch = clamp(pitch - (t.clientY - look.y) * .006, -1.1, 1.1);
      look.x = t.clientX; look.y = t.clientY;
    }
  }
  e.preventDefault();
}, { passive:false });
cv.addEventListener('touchend', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) { joy.on = false; joy.id = null; } if (t.identifier === look.id) look.id = null; }
});
$('list').addEventListener('click', e => e.currentTarget.classList.toggle('small'));

let toastT = 0;
function toast(text, color = '#fff', dur = 1.8) { const el = $('toast'); el.textContent = text; el.style.color = color; el.style.opacity = 1; toastT = dur; }

// ===== Ficklampan =====
function lightRange() { return 3 + battery * .07; } // i rutor
function canSee(m) {
  if (blackout > 0) return false;
  const dx = m.x - p.x, dy = m.y - p.y, d = Math.hypot(dx, dy);
  if (d > lightRange()) return false;
  if (d < .9) return true;
  const fx = -Math.sin(yaw), fy = -Math.cos(yaw);
  if ((dx * fx + dy * fy) / d < Math.cos(.58)) return false;
  return lineOfSight(p.x, p.y, m.x, m.y);
}

// ===== Uppdatering =====
const SPEED = 3.3;
function update(dt) {
  if (state !== 'play') return;
  time += dt;
  if (time >= dayLen) return lose('clock');
  battery = Math.max(0, battery - dt * 100 / 90);
  blackout -= dt; nextBlackout -= dt;
  if (nextBlackout <= 0) { blackout = rand(.9, 1.4); nextBlackout = rand(7, 13) - Math.min(level, 4); sfx.creak(); }
  hintT -= dt;

  // Gå och titta
  if (keys['arrowleft'] || keys['q']) yaw += 2.4 * dt;
  if (keys['arrowright'] || keys['e']) yaw -= 2.4 * dt;
  let mv = 0, st = 0;
  if (keys['w'] || keys['arrowup']) mv++;
  if (keys['s'] || keys['arrowdown']) mv--;
  if (keys['a']) st--;
  if (keys['d']) st++;
  if (joy.on) { st = clamp((joy.x - joy.ox) / 50, -1, 1); mv = clamp(-(joy.y - joy.oy) / 50, -1, 1); }
  const l = Math.hypot(mv, st); if (l > 1) { mv /= l; st /= l; }
  if (stun > 0) { stun -= dt; mv = st = 0; }
  const fx = -Math.sin(yaw), fy = -Math.cos(yaw), rx = -fy, ry = fx;
  const slippery = puddles.some(pd => dist(pd.x, pd.y, p.x, p.y) < .6);
  const k = stun > 0 ? 3 : slippery ? 1.2 : 12;
  p.vx += ((fx * mv + rx * st) * SPEED - p.vx) * Math.min(1, k * dt);
  p.vy += ((fy * mv + ry * st) * SPEED - p.vy) * Math.min(1, k * dt);
  moveBody(p, p.vx * dt, p.vy * dt, .3);
  if (Math.hypot(p.vx, p.vy) > .5) bob += dt * 9;

  if (allDoneFlag && p.x < .75) return win();

  // Plocka varor
  for (const s of slots) {
    if (s.taken) continue;
    if (dist(s.tx + .5, s.ty + .5, p.x, p.y) > .8) continue;
    const want = list.find(l => l.slot === s && !l.got);
    if (want) {
      want.got = true; s.taken = true; dyn.remove(s.sprite); sfx.pick();
      toast(`${s.e} ${s.name} ✔`, '#45ff8a');
      renderList();
      if (allDone()) {
        allDoneFlag = true; dyn.remove(exitDoor);
        exitLight = new THREE.PointLight(0x33ff77, 8, 14, 1); exitLight.position.set(1, 2, 13 * T); dyn.add(exitLight);
        setTimeout(() => toast('Allt klart! Spring till utgången! 🚗', '#ffd23f', 3), 900);
      }
    } else if (hintT <= 0) { hintT = 2.5; toast(`${s.e} Inte på listan`, '#bbb'); }
  }
  // Laddstationen
  if (dist(CHARGER.x + .5, CHARGER.y + .5, p.x, p.y) < .9 && battery < 100) {
    const before = battery; battery = Math.min(100, battery + 60 * dt);
    if (before < 95 && battery >= 95) { beep(880, .15, 'triangle'); toast('Full ficklampa! 🔦', '#ffd23f'); }
  }
  // Spökkundvagnar
  for (const c of carts) {
    c.cd -= dt; c.x += c.vx * dt;
    if (solid(c.x + Math.sign(c.vx) * .6, c.y)) c.vx *= -1;
    if (c.cd <= 0 && dist(c.x, c.y, p.x, p.y) < .7) {
      c.cd = 1.5; stun = .4; shake = .35; sfx.hit();
      p.vx = Math.sign(c.vx) * 7; p.vy = (p.y < c.y ? -1 : 1) * 3;
      toast('Hihihi! 👻', '#c9b8ff');
    }
  }
  // Städrobotar
  for (const r of robots) {
    r.cd -= dt; r.drop -= dt;
    const d = dist(r.x, r.y, r.tx, r.ty);
    if (d < .2) newRobotTarget(r);
    else { const m = moveBody(r, (r.tx - r.x) / d * 1.4 * dt, (r.ty - r.y) / d * 1.4 * dt, .35); if (m.bx || m.by) newRobotTarget(r); }
    if (r.drop <= 0) {
      r.drop = rand(2.5, 4.5);
      if (puddles.length < 14) {
        const mesh = new THREE.Mesh(new THREE.CircleGeometry(.6 * T / 2, 20), new THREE.MeshStandardMaterial({ color:0x2a7fff, transparent:true, opacity:.6, metalness:.6, roughness:.1 }));
        mesh.rotation.x = -Math.PI / 2; mesh.position.set(r.x * T, .02, r.y * T); dyn.add(mesh);
        puddles.push({ x:r.x, y:r.y, t:14, mesh });
      }
    }
    if (r.cd <= 0 && dist(r.x, r.y, p.x, p.y) < .7) {
      r.cd = 1.5; stun = .3; shake = .2; sfx.hit();
      p.vx = (p.x - r.x) * 6; p.vy = (p.y - r.y) * 6;
      toast('STÄÄÄDA... DIG... 🤖', '#ff4d6d');
    }
  }
  puddles.forEach(pd => { pd.t -= dt; pd.mesh.material.opacity = Math.min(.6, pd.t / 4); if (pd.t <= 0) dyn.remove(pd.mesh); });
  puddles = puddles.filter(pd => pd.t > 0);

  // Skyltdockor: rör sig bara när du inte tittar!
  flowT -= dt; if (flowT <= 0) { flowT = .25; computeFlow(); }
  let nearest = 99;
  for (const m of mannequins) {
    m.cd -= dt;
    m.seen = canSee(m);
    const d = dist(m.x, m.y, p.x, p.y);
    if (!m.seen) nearest = Math.min(nearest, d);
    if (m.seen || m.cd > 0) continue;
    const sp = blackout > 0 ? 3.4 : 1.3 + level * .15;
    const tx = Math.floor(m.x), ty = Math.floor(m.y);
    let gx = p.x, gy = p.y, best = flow[ty]?.[tx] ?? 1e9;
    if (best > 0) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const v = flow[ty + dy]?.[tx + dx];
      if (v !== undefined && v < best) { best = v; gx = tx + dx + .5; gy = ty + dy + .5; }
    }
    const gd = dist(m.x, m.y, gx, gy) || 1;
    moveBody(m, (gx - m.x) / gd * sp * dt, (gy - m.y) / gd * sp * dt, .25);
    m.face = Math.atan2(p.x - m.x, p.y - m.y);
    if (d < 8) { m.stepT -= dt; if (m.stepT <= 0) { m.stepT = blackout > 0 ? .2 : .5; sfx.step((8 - d) / 8 * .07); } }
    if (d < .6) { caught(m); if (state !== 'play') return; }
  }
  if (nearest < 4) { heartT -= dt; if (heartT <= 0) { heartT = nearest < 2 ? .5 : .85; sfx.heart(); } }
}

function caught(m) {
  lives--; sfx.scream(); shake = .6;
  $('scare').style.display = 'flex';
  toast(BOO_LINES[Math.random() * BOO_LINES.length | 0], '#ff4d6d', 2);
  mannequins.forEach(o => o.cd = Math.max(o.cd, 2));
  m.x = m.px; m.y = m.py; m.cd = 4;
  if (lives <= 0) { state = 'dying'; setTimeout(() => { $('scare').style.display = 'none'; lose('caught'); }, 1100); }
  else setTimeout(() => $('scare').style.display = 'none', 700);
}

// ===== Rita =====
const mini = $('mini'), mctx = mini.getContext('2d');
function render(now, dt) {
  const sx = shake > 0 ? rand(-.08, .08) : 0, sy = shake > 0 ? rand(-.08, .08) : 0;
  shake = Math.max(0, shake - dt);
  camera.position.set(p.x * T + sx, EYE + Math.sin(bob) * .05 + sy, p.y * T);
  camera.rotation.set(pitch, yaw, 0);
  const flick = battery < 20 && Math.random() < .15 ? .3 : 1;
  flash.intensity = blackout > 0 ? 0 : 30 * flick;
  flash.distance = lightRange() * T * 1.4;
  amb.intensity = blackout > 0 ? .03 : .5;
  for (const m of mannequins) { m.mesh.position.set(m.x * T, 0, m.y * T); m.mesh.rotation.y = m.face; }
  for (const r of robots) { r.mesh.position.set(r.x * T, 0, r.y * T); r.mesh.rotation.y = Math.atan2(r.tx - r.x, r.ty - r.y); }
  for (const c of carts) {
    c.mesh.position.set(c.x * T, 0, c.y * T);
    c.mesh.userData.ghost.position.y = 1.6 + Math.sin(now / 200 + c.y) * .12;
  }
  const pulse = 1 + Math.sin(now / 250) * .12;
  list.forEach(l => { if (!l.got) l.slot.sprite.scale.setScalar(.8 * pulse); });
  renderer.render(scene, camera);
  drawMinimap(now);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').style.opacity = 0; }
  $('hint').style.display = state === 'play' && !isTouch && document.pointerLockElement !== cv ? 'block' : 'none';
}

function drawMinimap(now) {
  const m = innerWidth < 600 ? 3 : 4;
  if (mini.width !== MW * m) { mini.width = MW * m; mini.height = MH * m; }
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const g = grid[y][x], r = room[y][x];
    mctx.fillStyle = g === 1 ? '#2a2250' : g === 2 ? '#6b4a2e' : g === 3 ? (allDoneFlag ? '#1fdc6a' : '#8a2b3c') : r >= 0 ? SHOPS[r].floor : '#888';
    mctx.fillRect(x * m, y * m, m, m);
  }
  if (Math.sin(now / 150) > 0) {
    mctx.fillStyle = '#ff9d00';
    list.forEach(l => { if (!l.got) mctx.fillRect(l.slot.tx * m - 1, l.slot.ty * m - 1, m + 2, m + 2); });
  }
  mctx.fillStyle = '#44ff88'; mctx.fillRect(CHARGER.x * m, CHARGER.y * m, m, m);
  const px = p.x * m, py = p.y * m;
  mctx.strokeStyle = '#ff3df0'; mctx.lineWidth = 2;
  mctx.beginPath(); mctx.moveTo(px, py); mctx.lineTo(px - Math.sin(yaw) * m * 2.5, py - Math.cos(yaw) * m * 2.5); mctx.stroke();
  mctx.fillStyle = '#ff3df0'; mctx.beginPath(); mctx.arc(px, py, m * .9, 0, 7); mctx.fill();
}

// ===== HUD och listor =====
function renderList() {
  const part = who => list.filter(l => l.who === who).map(l => `<div class="it ${l.got ? 'got' : ''}">${l.slot.e} ${l.slot.name}</div>`).join('');
  const left = list.filter(l => !l.got).length;
  $('list').innerHTML = `<b>📝 Inköpslistan (${list.length - left}/${list.length})</b><div class="items">
    <h3>👩 Mamma</h3>${part('mamma')}<h3>👨 Pappa</h3>${part('pappa')}</div>
    ${left ? '' : '<div style="color:#45ff8a;margin-top:6px"><b>Klart! Spring till utgången 🚗</b></div>'}`;
}
function updateHud() {
  $('lvl').textContent = level;
  const mins = 20 * 60 + Math.floor(time / dayLen * 240);
  $('clock').textContent = `🕛 ${String(Math.floor(mins / 60) % 24).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
  $('clock').className = dayLen - time < 25 ? 'warn' : '';
  const e = clamp(battery, 0, 100);
  $('eBar').style.width = e + '%'; $('eBar').style.background = e < 25 ? '#ff4d6d' : '#ffd23f';
  $('lives').textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(3 - Math.max(0, lives));
}

// ===== Skärmar =====
function show(html) { $('screen').innerHTML = `<div class="box">${html}</div>`; $('screen').classList.remove('hidden'); if (document.pointerLockElement) document.exitPointerLock(); }
function hide() { $('screen').classList.add('hidden'); }
function notes() {
  const n = who => list.filter(l => l.who === who).map(l => `${l.slot.e} ${l.slot.name}`).join('<br>');
  return `<div class="notes"><div class="note"><b>👩 Mammas lista</b>${n('mamma')}</div><div class="note"><b>👨 Pappas lista</b>${n('pappa')}</div></div>`;
}
function menu() {
  state = 'menu'; setupLevel(); updateHud();
  const best = save0.best ? `<p>🏆 Ditt rekord: nivå ${save0.best}</p>` : '';
  const ctrl = isTouch
    ? '🎮 Dra med vänster tumme för att gå. Dra med höger tumme för att titta runt.'
    : '🎮 Gå med WASD eller piltangenterna. Titta runt med musen (klicka först). Tryck Esc för att släppa musen.';
  show(`<h1>🔦 Mörka köpcentret</h1>
    <p>Mamma och pappa glömde handla! Klockan är 20:00 och köpcentret har nattöppet... men alla lampor är släckta och något är MYCKET konstigt. Köp allt på listorna och spring ut till bilen innan klockan slår tolv!</p>
    <p><b>Nivå ${level}</b></p>
    ${notes()}${best}
    <button class="btn" id="goBtn">Kör! 🏃</button>
    <div class="tips">
      ${ctrl}<br>
      🧍 Skyltdockorna rör sig bara när du INTE tittar på dem. Håll ficklampan på dem! Men ibland slocknar lampan...<br>
      👂 Hör du steg? Vänd dig om!<br>
      🔦 Ficklampan blir svagare. Ladda den vid 🔋 laddstationen i Elektronik.<br>
      👻 Akta dig för spökkundvagnarna och 🤖 städroboten som gör golvet halt.
    </div>`);
  $('goBtn').onclick = start;
}
function start() {
  hide(); state = 'play'; beep(440, .05);
  if (!isTouch) lockMouse();
}
function lose(why) {
  state = 'over'; sfx.lose();
  const txt = {
    clock:['🕛 Klockan slog tolv!', 'Alla skyltdockor vaknade på riktigt och började dansa runt dig. Du fick springa ut tomhänt!'],
    caught:['🧍 Skyltdockorna tog dig!', 'Nu står du i skyltfönstret och poserar i en jättefin kostym... Försök igen och håll ficklampan på dem!'],
  }[why];
  show(`<h1>${txt[0]}</h1><p>${txt[1]}</p><p>Du hann hitta ${list.filter(l => l.got).length} av ${list.length} saker.</p>
    <button class="btn" id="goBtn">Försök igen 🔁</button>`);
  $('goBtn').onclick = menu;
}
function win() {
  state = 'over'; sfx.win();
  const stars = 1 + (dayLen - time > dayLen * .3 ? 1 : 0) + (lives === 3 ? 1 : 0);
  save0.best = Math.max(save0.best || 0, level + 1); storeSave(save0);
  const cheer = ['Puh! Mamma och pappa kramar dig i bilen! 🚗', 'Du är modigare än ett spöke!', 'Wow! Inte ens skyltdockorna kunde stoppa dig!'][stars - 1];
  show(`<h1>🎉 Du överlevde!</h1><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <p>${cheer}</p><p>Nästa nivå: längre listor, fler skyltdockor och spöken!</p>
    <button class="btn" id="goBtn">Nästa nivå ➡</button>
    <button class="btn alt" id="againBtn">Samma nivå igen</button>`);
  $('goBtn').onclick = () => { level++; menu(); };
  $('againBtn').onclick = menu;
}

// ===== Spel-loop =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  render(now, dt);
  if (state === 'play') updateHud();
  requestAnimationFrame(loop);
}
menu();
requestAnimationFrame(loop);
// För testning
window.__game = { get state() { return state; }, get p() { return p; }, get list() { return list; }, get mannequins() { return mannequins; },
  set yaw(v) { yaw = v; }, get yaw() { return yaw; }, keys, grid, update, render, menu, start, set level(v) { level = v; },
  get lives() { return lives; }, get time() { return time; }, get battery() { return battery; } };
</script>
</body>
</html>
