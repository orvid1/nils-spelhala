<!DOCTYPE html>
<html lang="sv">
<head>

<style>
  :root { --bg:#0b0820; --neon:#00e5ff; --pink:#ff3df0; --gold:#ffd23f; --green:#45ff8a; --red:#ff4d6d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden;
    font-family:'Trebuchet MS', system-ui, sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas#c { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; gap:16px; align-items:center; flex-wrap:wrap;
    padding:8px 12px; background:rgba(11,8,32,.75); font-weight:bold; font-size:16px; pointer-events:none;
    border-bottom:2px solid rgba(255,77,109,.35); }
  #hud a { pointer-events:auto; color:var(--neon); text-decoration:none; }
  .bar { width:90px; height:12px; background:#2b2650; border-radius:6px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:4px; }
  .bar i { display:block; height:100%; }
  #clock.warn { color:var(--gold); }
  #mini { position:fixed; top:52px; left:10px; border:2px solid rgba(255,255,255,.2); border-radius:6px; opacity:.9; }
  #list { position:fixed; top:52px; right:10px; background:rgba(11,8,32,.85); border:2px solid var(--gold);
    border-radius:14px; padding:8px 12px; font-size:15px; min-width:170px; max-width:46vw; cursor:pointer; }
  #list h3 { margin:6px 0 2px; font-size:14px; color:var(--gold); }
  #list .it.got { color:var(--green); text-decoration:line-through; opacity:.75; }
  #list.small .items { display:none; }
  #toast { position:fixed; left:50%; bottom:16%; transform:translateX(-50%); font-size:22px; font-weight:bold; width:90vw;
    text-shadow:0 0 6px #000, 0 0 12px #000; pointer-events:none; text-align:center; transition:opacity .3s; }
  #hint { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.7); padding:12px 20px;
    border-radius:12px; font-size:18px; pointer-events:none; display:none; }
  #cross { position:fixed; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; border:2px solid rgba(255,255,255,.6); pointer-events:none; }
  #gun { position:fixed; right:4vw; bottom:-3vmin; font-size:26vmin; pointer-events:none; display:none;
    font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif; filter:drop-shadow(0 0 8px #000); }
  #shootBtn { position:fixed; right:18px; bottom:30vmin; width:84px; height:84px; border-radius:50%; border:3px solid #fff;
    background:rgba(255,77,109,.55); font-size:36px; display:none; align-items:center; justify-content:center; }
  #scare { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(90,0,0,.6); pointer-events:none; }

    transform:rotate(-2deg); box-shadow:3px 4px 0 rgba(0,0,0,.4); font-size:16px; }
  .note:nth-child(2) { transform:rotate(2deg); background:#d6f5ff; }
  .note b { display:block; margin-bottom:4px; }
  .btn { font:inherit; font-size:20px; font-weight:bold; padding:12px 26px; margin:6px; border:none; border-radius:14px; cursor:pointer;
    background:var(--green); color:#0b0820; box-shadow:0 5px 0 #1b9c4e; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #1b9c4e; }
  .btn.alt { background:var(--neon); box-shadow:0 5px 0 #0089a0; }

  #buildbar { position:fixed; left:50%; bottom:8px; transform:translateX(-50%); display:none; gap:6px; flex-wrap:wrap; justify-content:center; width:max-content; max-width:96vw; }
  #buildbar button { font:inherit; font-size:14px; font-weight:bold; color:#fff; background:rgba(11,8,32,.85); border:2px solid #9c6b3c;
    border-radius:10px; padding:6px 10px; cursor:pointer; }
  #buildbar button b { color:var(--gold); margin-right:4px; }
  #buildbar button small { color:#e6c28f; }
  #buildbar button.no { opacity:.4; }
  #sleep { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(5,10,40,.78); font-size:40px; font-weight:bold; pointer-events:none; text-shadow:0 0 12px #000; }
  #sleep small { font-size:18px; color:#9fd0ff; margin-top:8px; }

</head>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

// ===== Karta (i rutor) =====
const MW = 36, MH = 26;
const SHOPS = [
  { name:'Mataffären', sign:'🛒', x0:0,  y0:0,  x1:12, y1:9,  door:[6,9],   floor:'#cfe8cf', shelves:true,
    items:[['🥛','Mjölk'],['🍌','Bananer'],['🧀','Ost'],['🥚','Ägg'],['🍝','Pasta'],['🥕','Morötter'],['🍎','Äpplen'],['🧈','Smör'],['🧻','Toapapper'],['🥒','Gurka']] },
  { name:'Apoteket', sign:'💊', x0:12, y0:0,  x1:20, y1:9,  door:[16,9],  floor:'#d8f0ea', shelves:true,
    items:[['🩹','Plåster'],['🪥','Tandborste'],['🧴','Solkräm'],['💊','Vitaminer'],['🧼','Tvål']] },
  { name:'Leksaker', sign:'🧸', x0:20, y0:0, x1:28, y1:9, door:[24,9], floor:'#f5d9ef', shelves:true,

  { name:'Elektronik', sign:'🔌', x0:28, y0:0,  x1:35, y1:9,  door:[31,9],  floor:'#d9dcf5', shelves:true,

  { name:'Kläder', sign:'👕', x0:0,  y0:16, x1:10, y1:25, door:[5,16],  floor:'#f5e3cf', shelves:true,
    items:[['🧦','Strumpor'],['🧢','Keps'],['🧤','Vantar'],['👕','T-shirt'],['🧣','Halsduk']] },
  { name:'Kiosken', sign:'🌭', x0:10, y0:16, x1:20, y1:25, door:[14,16], floor:'#fff1c2', shelves:false, items:[] },
  { name:'Toaletten', sign:'🚽', x0:20, y0:16, x1:25, y1:25, door:[22,16], floor:'#dff3ff', shelves:false, items:[] },
  { name:'Sport', sign:'⚽', x0:25, y0:16, x1:35, y1:25, door:[30,16], floor:'#e1f5d0', shelves:true,
    items:[['⚽','Fotboll'],['🎾','Tennisbollar'],['🏓','Pingisbollar'],['🪁','Drake'],['🕶️','Solglasögon']] },
];
const BOO_LINES = ['Hehehe... jag är ingen riktig vakt!', 'BÖÖ! Lurade dig!', 'Du får aldrig gå hem!', 'Jag ser dig...'];
const GUARD_HELLO = ['Hej! Allt lugnt?', 'Akta dig för de konstiga vakterna!', 'Konstigt ställe på natten, va?', 'Jag håller utkik!'];
const ANOMALIES = ['ögon', 'baklänges', 'lång', 'ansikte', 'armar', 'svävar', 'lampa'];
const TOILETS = [[21, 21], [24, 21], [21, 24], [24, 24]];

const grid = [], room = [], slotPos = [];
for (let y = 0; y < MH; y++) { grid.push(new Array(MW).fill(0)); room.push(new Array(MW).fill(-1)); }
SHOPS.forEach((s, id) => {
  for (let y = s.y0; y <= s.y1; y++) for (let x = s.x0; x <= s.x1; x++) {
    if (x === s.x0 || x === s.x1 || y === s.y0 || y === s.y1) grid[y][x] = 1; else room[y][x] = id;
  }
});
for (let y = 10; y <= 15; y++) { grid[y][0] = 1; grid[y][MW - 1] = 1; }
grid[12][0] = 3; grid[13][0] = 3; // låst utgång
SHOPS.forEach(s => { grid[s.door[1]][s.door[0]] = 0; grid[s.door[1]][s.door[0] + 1] = 0; });
SHOPS.forEach((s, id) => {
  slotPos[id] = [];
  if (!s.shelves) return;
  [s.y0 + 3, s.y0 + 6].forEach(sy => {
    for (let x = s.x0 + 2; x <= s.x1 - 2; x++) grid[sy][x] = 2;
    for (let x = s.x0 + 2; x <= s.x1 - 2; x += 2) { slotPos[id].push([x, sy - 1, 1]); slotPos[id].push([x, sy + 1, -1]); }
  });
});
for (let x = 12; x <= 18; x++) grid[20][x] = 2; // kioskdisk
grid[23][13] = 2; grid[23][17] = 2;
TOILETS.forEach(([x, y]) => grid[y][x] = 4);

// ===== Hjälpfunktioner =====
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
function loadSave() { try { return JSON.parse(localStorage.getItem('nils_kopcentret_v1')) || {}; } catch (e) { return {}; } }
function storeSave(d) { try { localStorage.setItem('nils_kopcentret_v1', JSON.stringify(d)); } catch (e) {} }
// Rutor i grid: 0 golv, 1 vägg, 2 hylla, 3 låst dörr, 4 toalett, 5 barrikad, 6 lägereld
// Nivå 0 = golvet, nivå 1 = uppe på hyllorna
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function solid(x, y, l = 0) {
  const tx = Math.floor(x), ty = Math.floor(y);
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return true;
  const g = grid[ty][tx];
  if (g === 1 || g === 3 || g === 5 || g === 6) return true;
  return l === 0 && g === 2;
}
const walkable = (x, y) => grid[y] && (grid[y][x] === 0 || grid[y][x] === 4);
const isShelf = (x, y) => grid[y] && grid[y][x] === 2;
const shelfH = (x, y) => room[y][x] === 5 ? 1.1 : 1.8;
const hits = (x, y, r, l) => solid(x - r, y - r, l) || solid(x + r, y - r, l) || solid(x - r, y + r, l) || solid(x + r, y + r, l);
function moveBody(o, dx, dy, r, l = o.level || 0) {
  let bx = false, by = false;
  const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / .12) || 1;
  for (let i = 0; i < steps; i++) {
    if (!bx) { if (!hits(o.x + dx / steps, o.y, r, l)) o.x += dx / steps; else bx = true; }
    if (!by) { if (!hits(o.x, o.y + dy / steps, r, l)) o.y += dy / steps; else by = true; }
  }
  return { bx, by };
}
// Kliver man av kanten på en hylla ramlar man ner på golvet
function checkDrop(o, r) {
  if (!o.level) return false;
  const tx = Math.floor(o.x), ty = Math.floor(o.y);
  if (isShelf(tx, ty)) return false;
  o.level = 0;
  o.x = clamp(o.x, tx + r + .01, tx + 1 - r - .01); o.y = clamp(o.y, ty + r + .01, ty + 1 - r - .01);
  return true;
}
// high = någon står uppe på en hylla, då skymmer inte hyllorna sikten
function lineOfSight(ax, ay, bx, by, high = false) {
  const n = Math.ceil(dist(ax, ay, bx, by) / .2);
  for (let i = 1; i < n; i++) {
    const g = grid[Math.floor(ay + (by - ay) * i / n)][Math.floor(ax + (bx - ax) * i / n)];
    if (g === 1 || (g === 2 && !high)) return false;
  }
  return true;
}
function farTile(minD) {
  for (let i = 0; i < 400; i++) {
    const x = rand(1, MW - 1) | 0, y = rand(1, MH - 1) | 0;
    if (walkable(x, y) && dist(x + .5, y + .5, p.x, p.y) > minD) return [x + .5, y + .5];
  }
  return [33.5, 12.5];
}

// ===== Ljud =====
let AC = null;
function beep(f, dur = .12, type = 'square', vol = .08, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, f + slide), AC.currentTime + dur);
    g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  pick() { beep(660, .08); setTimeout(() => beep(990, .12), 70); },
  chest() { [392, 523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, .12, 'triangle', .1), i * 70)); },
  bang() { beep(160, .18, 'sawtooth', .2, -130); beep(900, .05, 'square', .12, -700); },
  empty() { beep(1300, .03, 'square', .06); },
  poof() { beep(600, .35, 'sine', .1, -500); },
  hit() { beep(180, .25, 'sawtooth', .1, -120); },
  creak() { beep(90, .9, 'sawtooth', .06, -40); },
  step(v) { beep(1600, .03, 'square', v); setTimeout(() => beep(1100, .03, 'square', v * .7), 60); },
  heart() { beep(55, .12, 'sine', .25); setTimeout(() => beep(50, .12, 'sine', .2), 160); },
  scream() { beep(900, .5, 'sawtooth', .14, -600); beep(1250, .4, 'square', .07, -900); },
  build() { [220, 260, 220, 300].forEach((f, i) => setTimeout(() => beep(f, .08, 'square', .09), i * 90)); },
  climb() { [300, 360, 420].forEach((f, i) => setTimeout(() => beep(f, .07, 'triangle', .07), i * 120)); },
  thud() { beep(120, .15, 'sine', .15, -60); },
  smash() { beep(140, .12, 'square', .12, -80); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .2, 'triangle', .1), i * 130)); },
  lose() { [400, 300, 200].forEach((f, i) => setTimeout(() => beep(f, .25, 'sawtooth', .08), i * 180)); },
};

// ===== 3D-värld =====
const T = 2, WALL_H = 4, EYE = 1.55;
const cv = $('c');
const renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 3, 24);
const camera = new THREE.PerspectiveCamera(72, 1, .05, 100);
camera.rotation.order = 'YXZ';
scene.add(camera);
const amb = new THREE.AmbientLight(0x6a5a99, .5);
scene.add(amb);
const flash = new THREE.SpotLight(0xfff0cc, 30, 20, .5, .45, 1);
flash.position.set(.25, -.25, 0);
flash.target.position.set(0, -.3, -1);
camera.add(flash); camera.add(flash.target);
const muzzle = new THREE.PointLight(0xffaa44, 0, 10, 1);
muzzle.position.set(.3, -.2, -.6); camera.add(muzzle);
function lockMouse() { try { const r = cv.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const texCache = {};
function emojiTex(e) {
  if (texCache[e]) return texCache[e];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.font = '100px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(e, 64, 72);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return texCache[e] = t;
}
function sprite(e, s = 1) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:emojiTex(e), transparent:true }));
  sp.scale.set(s, s, s); return sp;
}
function signMesh(text) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(25,8,50,.95)'; x.fillRect(0, 0, 512, 128);
  x.strokeStyle = '#ff3df0'; x.lineWidth = 8; x.strokeRect(4, 4, 504, 120);
  x.font = 'bold 60px "Trebuchet MS","Segoe UI Emoji",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = '#ff3df0'; x.shadowBlur = 18; x.fillStyle = '#ffd6fb'; x.fillText(text, 256, 68);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(2.6, .65), new THREE.MeshBasicMaterial({ map:t, transparent:true }));
}

// Statisk värld: väggar, hyllor, golv, tak, skyltar
(function buildStatic() {
  const walls = [], shelves = [], floors = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const g = grid[y][x];
    if (g === 1) walls.push([x, y]); else if (g === 2) shelves.push([x, y]);
    if (g !== 1) floors.push([x, y]);
  }
  const m4 = new THREE.Matrix4();
  const wallMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(T, WALL_H, T),
    new THREE.MeshStandardMaterial({ color:0x8a7fa3, roughness:.95 }), walls.length);
  walls.forEach(([x, y], i) => wallMesh.setMatrixAt(i, m4.makeTranslation((x + .5) * T, WALL_H / 2, (y + .5) * T)));
  scene.add(wallMesh);
  const shelfMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(T * .98, 1.8, T * .75),
    new THREE.MeshStandardMaterial({ color:0x7a5535, roughness:.8 }), shelves.length);
  shelves.forEach(([x, y], i) => {
    const h = room[y][x] === 5 ? 1.1 : 1.8;
    shelfMesh.setMatrixAt(i, m4.compose(new THREE.Vector3((x + .5) * T, h / 2, (y + .5) * T), new THREE.Quaternion(), new THREE.Vector3(1, h / 1.8, 1)));
  });
  scene.add(shelfMesh);
  const floorGeo = new THREE.PlaneGeometry(T, T); floorGeo.rotateX(-Math.PI / 2);
  const floorMesh = new THREE.InstancedMesh(floorGeo, new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.6 }), floors.length);
  const col = new THREE.Color();
  floors.forEach(([x, y], i) => {
    floorMesh.setMatrixAt(i, m4.makeTranslation((x + .5) * T, 0, (y + .5) * T));
    const r = room[y][x];
    col.set(r >= 0 ? SHOPS[r].floor : ((x + y) % 2 ? '#bdb6a6' : '#aaa393'));
    floorMesh.setColorAt(i, col);

function interact() {

  if (p.level) return toast('Hoppa ner från hyllan genom att gå av kanten.', '#ccc');
  const t = tents.find(t => dist(t.x + .5, t.y + .5, p.x, p.y) < .8);
  if (t) {
    sleeping = true; sleepHealT = 0;
    const safe = burning().some(f => dist(f.x + .5, f.y + .5, p.x, p.y) < FIRE_R);
    toast(safe ? '💤 Du somnar tryggt vid elden...' : '💤 Du somnar... men det finns ingen eld i närheten!', safe ? '#9fd0ff' : '#ffd23f', 3);

// ===== Pistolen =====
function poof(x, y, h = 1.2) { const s = sprite('💨', 1.4); s.position.set(x * T, h, y * T); dyn.add(s); poofs.push({ s, t:.8 }); sfx.poof(); }
function shoot() {
  if (state !== 'play' || sleeping) return;
  if (!hasGun) { toast('Du har ingen pistol. Leta i kistor 🧰', '#ccc'); return; }
  if (shootCd > 0) return;
  shootCd = .35; kick = 1; muzzle.intensity = 25; sfx.bang();
  const fx = -Math.sin(yaw), fy = -Math.cos(yaw);
  let wall = 16;
  for (let t = 0; t < 16; t += .1) {
    const g = grid[Math.floor(p.y + fy * t)]?.[Math.floor(p.x + fx * t)];
    if (g === undefined || g === 1 || g === 3 || (g === 2 && !p.level)) { wall = t; break; }
  }
  let best = null, bt = wall;
  const cands = [
    ...guards.filter(g => !g.dead).map(o => ({ o, kind:'vakt', r:.4 })),
    ...carts.filter(c => c.ghost).map(o => ({ o, kind:'spöke', r:.55 })),
  ];
  for (const c of cands) {
    const dx = c.o.x - p.x, dy = c.o.y - p.y, t = dx * fx + dy * fy;
    if (t <= 0 || t >= bt) continue;
    if (Math.abs(dx * fy - dy * fx) < c.r) { bt = t; best = c; }
  }
  if (!best) return;
  const o = best.o;
  if (best.kind === 'spöke') {
    poof(o.x, o.y, 1.6); o.ghost = false; o.vx = 0; o.mesh.userData.ghost.visible = false; toast('Spöket är borta! 👻💨', '#45ff8a');
  } else if (o.anomaly) {

  } else {
    hasGun = false; sfx.hit();
    toast('AJ! Hallå! Jag är en RIKTIG vakt! Nu tar jag din pistol! 😠', '#ff4d6d', 3);
    o.cd = 20;
  }
}

// ===== Ficklampan =====
const lightRange = () => 10; // i rutor

// ===== Uppdatering =====
const SPEED = 3.3;
function update(dt) {
  if (state !== 'play') return;
  time += sleeping ? dt * 4 : dt;
  if (time >= nightLen) return dawn();
  // Sova i tältet: natten går fortare och man får tillbaka hjärtan
  if (sleeping) {
    sleepHealT += dt * 4;
    if (sleepHealT >= 25) { sleepHealT = 0; if (lives < 3) { lives++; toast('Du vilade dig ❤️ +1', '#ff6b8a'); } }
    const safe = burning().some(f => dist(f.x + .5, f.y + .5, p.x, p.y) < FIRE_R);
    const danger = guards.find(g => g.anomaly && !g.dead && dist(g.x, g.y, p.x, p.y) < (safe ? 1.5 : 5));
    if (danger || !tents.some(t => dist(t.x + .5, t.y + .5, p.x, p.y) < .8)) {
      sleeping = false; if (danger) { toast('Du vaknade! Något är nära! 😱', '#ff4d6d', 2.5); sfx.heart(); }
    }
  }
  blackout -= dt; nextBlackout -= dt; shootCd -= dt;
  if (nextBlackout <= 0) { blackout = rand(.9, 1.4); nextBlackout = rand(7, 13) - Math.min(night, 4); sfx.creak(); }
  hintT -= dt;

  // Gå och titta
  if (keys['arrowleft']) yaw += 2.4 * dt;
  if (keys['arrowright']) yaw -= 2.4 * dt;
  let mv = 0, st = 0;
  if (keys['w'] || keys['arrowup']) mv++;
  if (keys['s'] || keys['arrowdown']) mv--;
  if (keys['a']) st--;
  if (keys['d']) st++;
  if (joy.on) { st = clamp((joy.x - joy.ox) / 50, -1, 1); mv = clamp(-(joy.y - joy.oy) / 50, -1, 1); }
  const l = Math.hypot(mv, st); if (l > 1) { mv /= l; st /= l; }
  if (stun > 0) { stun -= dt; mv = st = 0; }
  if (sleeping) mv = st = 0;
  const fx = -Math.sin(yaw), fy = -Math.cos(yaw), rx = -fy, ry = fx;
  const slippery = !p.level && puddles.some(pd => dist(pd.x, pd.y, p.x, p.y) < .6);
  const k = stun > 0 ? 3 : slippery ? 1.2 : 12;
  p.vx += ((fx * mv + rx * st) * SPEED - p.vx) * Math.min(1, k * dt);
  p.vy += ((fy * mv + ry * st) * SPEED - p.vy) * Math.min(1, k * dt);
  moveBody(p, p.vx * dt, p.vy * dt, .3);
  if (checkDrop(p, .3)) { sfx.thud(); shake = .15; computeFlow(); }
  if (Math.hypot(p.vx, p.vy) > .5) bob += dt * 9;
  // Klättra upp: stå vid en stege och gå mot hyllan
  const L = !p.level && ladders.get(Math.floor(p.x) + ',' + Math.floor(p.y));
  const [ftx, fty] = frontTile();
  if (L && mv > 0 && L.sx === ftx && L.sy === fty) {
    climbT += dt;
    if (climbT > .3) {
      climbT = 0; p.level = 1; p.x = L.sx + .5; p.y = L.sy + .5; p.vx = p.vy = 0; sfx.climb(); computeFlow();
      if (!climbedOnce) { climbedOnce = true; toast('🪜 Du är uppe på hyllan! Gå av kanten för att hoppa ner.', '#45ff8a', 3); }
    }
  } else climbT = 0;

  // Plocka varor
  for (const s of slots) {
    if (p.level || s.taken || dist(s.tx + .5, s.ty + .5, p.x, p.y) > .8) continue;
    const want = list.find(l => l.slot === s && !l.got);
    if (want) {
      want.got = true; s.taken = true; dyn.remove(s.sprite); sfx.pick();
      toast(`${s.e} ${s.name} ✔`, '#45ff8a');
      renderList();
      if (list.every(l => l.got) && !listDoneShown) { listDoneShown = true; setTimeout(() => toast('Listan är klar! ⭐ Nu gäller det att överleva till 06:00!', '#ffd23f', 3), 900); }
    } else if (hintT <= 0) { hintT = 2.5; toast(`${s.e} Inte på listan`, '#bbb'); }
  }
  // Kistor
  for (const c of chests) {
    if (p.level || c.open || dist(c.x, c.y, p.x, p.y) > .95) continue;
    c.open = true; c.mesh.userData.lid.rotation.x = -1.9; c.mesh.userData.sparkle.visible = false; sfx.chest();
    if (!hasGun) { hasGun = true; toast('🧰 En PISTOL! 🔫 Den tar aldrig slut. Skjut med musklick eller mellanslag', '#ffd23f', 3.5); }
    else if (lives < 3) { lives++; toast('🧰 Ett extra hjärta! ❤️', '#ff6b8a'); }
    else toast('🧰 Kistan var tom... du har redan allt!', '#ccc');
  }
  // Nya kistor dyker upp under natten
  chestT -= dt;
  if (chestT <= 0) {
    chestT = 35;
    if (chests.filter(c => !c.open).length < 3) { addChest(); toast('✨ En ny kista har dykt upp någonstans!', '#ffd23f', 2.5); }
  }
  // Spökkundvagnar
  for (const c of carts) {
    if (!c.ghost) continue;
    c.cd -= dt; c.x += c.vx * dt;
    if (solid(c.x + Math.sign(c.vx) * .6, c.y)) c.vx *= -1;
    if (c.cd <= 0 && !p.level && dist(c.x, c.y, p.x, p.y) < .7) {
      c.cd = 1.5; stun = .4; shake = .35; sfx.hit();
      p.vx = Math.sign(c.vx) * 7; p.vy = (p.y < c.y ? -1 : 1) * 3;
      toast('Hihihi! 👻', '#c9b8ff');
    }
  }
  // Städrobotar
  for (const r of robots) {
    r.cd -= dt; r.drop -= dt;
    r.face = wander(r, 1.4, dt);
    if (r.drop <= 0) {
      r.drop = rand(2.5, 4.5);
      if (puddles.length < 14) {
        const mesh = new THREE.Mesh(new THREE.CircleGeometry(.6, 20), new THREE.MeshStandardMaterial({ color:0x2a7fff, transparent:true, opacity:.6, metalness:.6, roughness:.1 }));
        mesh.rotation.x = -Math.PI / 2; mesh.position.set(r.x * T, .02, r.y * T); dyn.add(mesh);
        puddles.push({ x:r.x, y:r.y, t:14, mesh });
      }
    }
    if (r.cd <= 0 && !p.level && dist(r.x, r.y, p.x, p.y) < .7) {
      r.cd = 1.5; stun = .3; shake = .2; sfx.hit();
      p.vx = (p.x - r.x) * 6; p.vy = (p.y - r.y) * 6;
      toast('STÄÄÄDA... DIG... 🤖', '#ff4d6d');
    }
  }
  puddles.forEach(pd => { pd.t -= dt; pd.mesh.material.opacity = Math.min(.6, pd.t / 4); if (pd.t <= 0) dyn.remove(pd.mesh); });

  poofs.forEach(f => { f.t -= dt; f.s.material.opacity = f.t / .8; f.s.position.y += dt; if (f.t <= 0) dyn.remove(f.s); });
  poofs = poofs.filter(f => f.t > 0);

  flowT -= dt; if (flowT <= 0) { flowT = .25; computeFlow(); }

  // Vakter: riktiga är snälla, anomalier anfaller
  let nearest = 99;
  for (const g of guards) {
    if (g.dead) {
      // En ny vakt kommer till jobbet... men är den riktig?
      g.respawnT -= dt;
      if (g.respawnT <= 0) {
        dyn.remove(g.mesh);
        g.anomaly = pick(ANOMALIES); g.mesh = makeGuard(g.anomaly); dyn.add(g.mesh);
        [g.x, g.y] = farTile(12); g.level = 0; g.climbT = 0; g.dead = false; g.cd = 3; newWanderTarget(g);
        toast('👮 En ny vakt har börjat jobba... är den riktig?', '#9fd0ff', 2.5);
      }
      continue;
    }
    g.cd -= dt;
    const d = dist(g.x, g.y, p.x, p.y);
    // Anomalier ser längre och springer fortare när lampan slocknar
    const range = g.anomaly ? (blackout > 0 ? 12 : 7) : 5;
    const hunting = g.anomaly && (g.climbT > 0 || g.level > 0);
    const sameLevel = (g.level || 0) === (p.level || 0);
    if (!g.anomaly && (p.level || g.level)) { g.face = wander(g, 1.1, dt); continue; }
    if (g.cd <= 0 && (hunting || d < range && (blackout > 0 && g.anomaly || lineOfSight(g.x, g.y, p.x, p.y, !!(p.level || g.level))))) {
      if (g.anomaly) {
        nearest = Math.min(nearest, d);
        if (d < 8) { g.stepT -= dt; if (g.stepT <= 0) { g.stepT = blackout > 0 ? .2 : .45; sfx.step((8 - d) / 8 * .07); } }
      }
      if (d > (g.anomaly ? .6 : 1.3) || !sameLevel) {
        const f = chase(g, g.anomaly ? (blackout > 0 ? 2.6 : 1.8 + night * .08) : 1.5, dt, .3, !!g.anomaly);
        if (f !== null) g.face = f;
        else if (g.anomaly) {
          // Vägen är spärrad: gå rakt mot spelaren och slå sönder barrikader
          const ox = g.x, oy = g.y;
          moveBody(g, (p.x - g.x) / (d || 1) * 1.2 * dt, (p.y - g.y) / (d || 1) * 1.2 * dt, .3);
          if (fireBlocks(ox, oy, g.x, g.y)) { g.x = ox; g.y = oy; }
          g.face = Math.atan2(p.x - g.x, p.y - g.y);
          const b = barricades.find(b => dist(b.x + .5, b.y + .5, g.x, g.y) < 1.25);
          if (b) {
            b.hp -= dt; g.bangT -= dt;

            if (b.hp <= 0) {

            }
          }

      }
      else if (g.anomaly) {

      }
      else {

        if (!g.gave) {

}

function attack(line) {

function drawMinimap(now) {
  const m = innerWidth < 600 ? 3 : 4;
  if (mini.width !== MW * m) { mini.width = MW * m; mini.height = MH * m; }
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const g = grid[y][x], r = room[y][x];
    mctx.fillStyle = g === 1 ? '#2a2250' : g === 2 ? '#6b4a2e' : g === 3 ? '#8a2b3c' : r >= 0 ? SHOPS[r].floor : '#888';
    mctx.fillRect(x * m, y * m, m, m);
  }
  if (Math.sin(now / 150) > 0) {
    mctx.fillStyle = '#ff9d00';
    list.forEach(l => { if (!l.got) mctx.fillRect(l.slot.tx * m - 1, l.slot.ty * m - 1, m + 2, m + 2); });
  }
  mctx.fillStyle = '#c98b4a'; barricades.forEach(b => mctx.fillRect(b.x * m, b.y * m, m, m));
  mctx.fillStyle = '#ffe14d'; ladders.forEach(L => mctx.fillRect(L.x * m + m / 4, L.y * m + m / 4, m / 2, m / 2));
  mctx.fillStyle = '#2ecc71'; tents.forEach(t => mctx.fillRect(t.x * m, t.y * m, m, m));
  mctx.fillStyle = '#ff7a2a'; fires.forEach(f => mctx.fillRect(f.x * m, f.y * m, m, m));

}

      🧰 Leta efter kistor i affärerna! Där finns pistolen (den tar aldrig slut) och extra hjärtan.<br>
      🔨 <b>Bygg</b> gratis med tangenterna 1 till 4:
      🪜 <b>Stege</b> (titta på en hylla) så kan du klättra upp. Anomalierna kan också klättra, men långsamt!
      🧱 <b>Barrikad</b> stoppar anomalierna en stund.
      🔥 <b>Lägereld</b>: anomalierna vågar inte gå nära elden.
      ⛺ <b>Tält</b>: gå in och tryck E för att sova. Då går natten fortare och du får tillbaka hjärtan. Bygg ett camp med eld och tält!<br>
      💡 Ibland slocknar lampan... då springer anomalierna fortare. Hör du steg? Vänd dig om!<br>
      👮 De riktiga säkerhetsvakterna är snälla och kan ge dig ett plåster. Men vissa vakter är <b>ANOMALIER</b>! Titta noga: röda ögon, huvudet bak och fram, för lång, inget ansikte, jättelånga armar, svävar i luften eller röd ficklampa. Skjut anomalierna, men skjut INTE de riktiga vakterna!
    </div>`);
  $('goBtn').onclick = start;
}
function start() {
  hide(); state = 'play'; beep(440, .05);
  if (!isTouch) lockMouse();
}
function lose() {
  state = 'over'; sfx.lose();
  show(`<h1>👾 Du klarade inte natten!</h1><p>Klockan var ${clockText()} när anomalierna tog dig. Nu måste du jobba som nattvakt för alltid... Försök igen!</p>
    <p>Du stoppade ${anomaliesStopped} anomali${anomaliesStopped === 1 ? '' : 'er'} och hittade ${list.filter(l => l.got).length} av ${list.length} saker.</p>
    <button class="btn" id="goBtn">Försök igen 🔁</button>`);
  $('goBtn').onclick = menu;
}
function dawn() {
  state = 'over'; sfx.win();
  const listDone = list.every(l => l.got);
  const stars = 1 + (listDone ? 1 : 0) + (lives === 3 ? 1 : 0);
  save0.best = Math.max(save0.best || 0, night + 1); storeSave(save0);
  show(`<h1>☀️ Klockan är 06:00!</h1><h2 style="margin:0;color:#45ff8a">Du överlevde natt ${night}!</h2>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <p>Lamporna tänds och mamma och pappa låser upp dörren. Puh! ${listDone ? 'Och du handlade ALLT på listan! 🛒' : ''}</p>
    <p>🎯 Anomalier stoppade: ${anomaliesStopped}</p>
    <p>Nästa natt blir längre och läskigare...</p>
    <button class="btn" id="goBtn">Nästa natt 🌙</button>
    <button class="btn alt" id="againBtn">Samma natt igen</button>`);
  $('goBtn').onclick = () => { night++; menu(); };
  $('againBtn').onclick = menu;
}

// ===== Spel-loop =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  render(now, dt);
  if (state === 'play') updateHud();
  requestAnimationFrame(loop);
}
menu();
requestAnimationFrame(loop);
// För testning
window.__game = { get state() { return state; }, get p() { return p; }, get list() { return list; },
  get guards() { return guards; }, get chests() { return chests; }, set yaw(v) { yaw = v; }, get yaw() { return yaw; },
  keys, grid, update, render, menu, start, shoot, set night(v) { night = v; }, get lives() { return lives; }, get time() { return time; },
  get hasGun() { return hasGun; }, get anomaliesStopped() { return anomaliesStopped; }, get nightLen() { return nightLen; },
  build, interact, get sleeping() { return sleeping; }, get fires() { return fires; },
  get barricades() { return barricades; }, get ladders() { return ladders; }, get tents() { return tents; }, computeFlow };
</script>
