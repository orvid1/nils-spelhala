<script type="module">
import * as THREE from 'three';

// ===== Karta (i rutor) =====
const MW = 36, MH = 26;
const SHOPS = [
  { name:'Mataffären', sign:'🛒', x0:0,  y0:0,  x1:12, y1:9,  door:[6,9],   floor:'#cfe8cf', shelves:true,
    items:[['🥛','Mjölk'],['🍌','Bananer'],['🧀','Ost'],['🥚','Ägg'],['🍝','Pasta'],['🥕','Morötter'],['🍎','Äpplen'],['🧈','Smör'],['🧻','Toapapper'],['🥒','Gurka']] },
  { name:'Apoteket', sign:'💊', x0:12, y0:0,  x1:20, y1:9,  door:[16,9],  floor:'#d8f0ea', shelves:true,
    items:[['🩹','Plåster'],['🪥','Tandborste'],['🧴','Solkräm'],['💊','Vitaminer'],['🧼','Tvål']] },
  { name:'Leksaker', sign:'🧸', x0:20, y0:0, x1:28, y1:9, door:[24,9], floor:'#f5d9ef', shelves:true,
    items:[['🧸','Nalle'],['🎲','Tärningar'],['🪀','Jojo'],['🧩','Pussel'],['🎈','Ballonger']] },
  { name:'Elektronik', sign:'🔌', x0:28, y0:0,  x1:35, y1:9,  door:[31,9],  floor:'#d9dcf5', shelves:true,
    items:[['🔋','Batterier'],['💡','Glödlampa'],['🎧','Hörlurar'],['🔌','Sladd']] },
  { name:'Kläder', sign:'👕', x0:0,  y0:16, x1:10, y1:25, door:[5,16],  floor:'#f5e3cf', shelves:true,
    items:[['🧦','Strumpor'],['🧢','Keps'],['🧤','Vantar'],['👕','T-shirt'],['🧣','Halsduk']] },
  { name:'Kiosken', sign:'🌭', x0:10, y0:16, x1:20, y1:25, door:[14,16], floor:'#fff1c2', shelves:false, items:[] },
  { name:'Toaletten', sign:'🚽', x0:20, y0:16, x1:25, y1:25, door:[22,16], floor:'#dff3ff', shelves:false, items:[] },
  { name:'Sport', sign:'⚽', x0:25, y0:16, x1:35, y1:25, door:[30,16], floor:'#e1f5d0', shelves:true,
    items:[['⚽','Fotboll'],['🎾','Tennisbollar'],['🏓','Pingisbollar'],['🪁','Drake'],['🕶️','Solglasögon']] },
];
const BOO_LINES = ['Hehehe... jag är ingen riktig vakt!', 'BÖÖ! Lurade dig!', 'Du får aldrig gå hem!', 'Jag ser dig...'];
const GUARD_HELLO = ['Hej! Allt lugnt?', 'Akta dig för de konstiga vakterna!', 'Konstigt ställe på natten, va?', 'Jag håller utkik!'];
const ANOMALIES = ['ögon', 'baklänges', 'lång', 'ansikte', 'armar', 'svävar', 'lampa'];
const TOILETS = [[21, 21], [24, 21], [21, 24], [24, 24]];
const SPAWNS = [[2.5, 13], [2.5, 11.8], [3.6, 13.9], [3.6, 11.2]];
const COLORS = ['#ff3df0', '#00e5ff', '#45ff8a', '#ffd23f'];

// Rutor i grid: 0 golv, 1 vägg, 2 hylla, 3 låst dörr, 4 toalett, 5 barrikad, 6 lägereld
// Nivå 0 = golvet, nivå 1 = uppe på hyllorna
const grid = [], room = [], slotPos = [];
for (let y = 0; y < MH; y++) { grid.push(new Array(MW).fill(0)); room.push(new Array(MW).fill(-1)); }
SHOPS.forEach((s, id) => {
  for (let y = s.y0; y <= s.y1; y++) for (let x = s.x0; x <= s.x1; x++) {
    if (x === s.x0 || x === s.x1 || y === s.y0 || y === s.y1) grid[y][x] = 1; else room[y][x] = id;
  }
});
for (let y = 10; y <= 15; y++) { grid[y][0] = 1; grid[y][MW - 1] = 1; }
grid[12][0] = 3; grid[13][0] = 3; // låst utgång
SHOPS.forEach(s => { grid[s.door[1]][s.door[0]] = 0; grid[s.door[1]][s.door[0] + 1] = 0; });
SHOPS.forEach((s, id) => {
  slotPos[id] = [];
  if (!s.shelves) return;
  [s.y0 + 3, s.y0 + 6].forEach(sy => {
    for (let x = s.x0 + 2; x <= s.x1 - 2; x++) grid[sy][x] = 2;
    for (let x = s.x0 + 2; x <= s.x1 - 2; x += 2) { slotPos[id].push([x, sy - 1, 1]); slotPos[id].push([x, sy + 1, -1]); }
  });
});
for (let x = 12; x <= 18; x++) grid[20][x] = 2; // kioskdisk
grid[23][13] = 2; grid[23][17] = 2;
TOILETS.forEach(([x, y]) => grid[y][x] = 4);

// ===== Hjälpfunktioner =====
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, a, b, d = 0) => typeof v === 'number' && isFinite(v) ? clamp(v, a, b) : d;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const $ = id => document.getElementById(id);
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function loadSave() { try { return JSON.parse(localStorage.getItem('nils_kopcentret_v1')) || {}; } catch (e) { return {}; } }
function storeSave(d) { try { localStorage.setItem('nils_kopcentret_v1', JSON.stringify(d)); } catch (e) {} }
function solid(x, y, l = 0) {
  const tx = Math.floor(x), ty = Math.floor(y);
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return true;
  const g = grid[ty][tx];
  if (g === 1 || g === 3 || g === 5 || g === 6) return true;
  return l === 0 && g === 2;
}
const walkable = (x, y) => grid[y] && (grid[y][x] === 0 || grid[y][x] === 4);
const isShelf = (x, y) => grid[y] && grid[y][x] === 2;
const shelfH = (x, y) => room[y] && room[y][x] === 5 ? 1.1 : 1.8;
const hits = (x, y, r, l) => solid(x - r, y - r, l) || solid(x + r, y - r, l) || solid(x - r, y + r, l) || solid(x + r, y + r, l);
function moveBody(o, dx, dy, r, l = o.level || 0) {
  let bx = false, by = false;
  const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / .12) || 1;
  for (let i = 0; i < steps; i++) {
    if (!bx) { if (!hits(o.x + dx / steps, o.y, r, l)) o.x += dx / steps; else bx = true; }
    if (!by) { if (!hits(o.x, o.y + dy / steps, r, l)) o.y += dy / steps; else by = true; }
  }
  return { bx, by };
}
// Kliver man av kanten på en hylla ramlar man ner på golvet
function checkDrop(o, r) {
  if (!o.level) return false;
  const tx = Math.floor(o.x), ty = Math.floor(o.y);
  if (isShelf(tx, ty)) return false;
  o.level = 0;
  o.x = clamp(o.x, tx + r + .01, tx + 1 - r - .01); o.y = clamp(o.y, ty + r + .01, ty + 1 - r - .01);
  return true;
}
// high = någon står uppe på en hylla, då skymmer inte hyllorna sikten
function lineOfSight(ax, ay, bx, by, high = false) {
  const n = Math.ceil(dist(ax, ay, bx, by) / .2);
  for (let i = 1; i < n; i++) {
    const g = grid[Math.floor(ay + (by - ay) * i / n)][Math.floor(ax + (bx - ax) * i / n)];
    if (g === 1 || (g === 2 && !high)) return false;
  }
  return true;
}
function farTile(minD) {
  for (let i = 0; i < 400; i++) {
    const x = rand(1, MW - 1) | 0, y = rand(1, MH - 1) | 0;
    if (walkable(x, y) && allPlayers().every(q => dist(x + .5, y + .5, q.x, q.y) > minD)) return [x + .5, y + .5];
  }
  return [33.5, 12.5];
}

// ===== Ljud =====
let AC = null;
function beep(f, dur = .12, type = 'square', vol = .08, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, f + slide), AC.currentTime + dur);
    g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
// iPhone/iPad: ljudet måste låsas upp av en tryckning
function unlockAudio() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
['touchstart', 'pointerdown', 'keydown'].forEach(ev => addEventListener(ev, unlockAudio, { passive:true }));
const sfx = {
  pick() { beep(660, .08); setTimeout(() => beep(990, .12), 70); },
  chest() { [392, 523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, .12, 'triangle', .1), i * 70)); },
  bang() { beep(160, .18, 'sawtooth', .2, -130); beep(900, .05, 'square', .12, -700); },
  poof() { beep(600, .35, 'sine', .1, -500); },
  hit() { beep(180, .25, 'sawtooth', .1, -120); },
  creak() { beep(90, .9, 'sawtooth', .06, -40); },
  step(v) { beep(1600, .03, 'square', v); setTimeout(() => beep(1100, .03, 'square', v * .7), 60); },
  heart() { beep(55, .12, 'sine', .25); setTimeout(() => beep(50, .12, 'sine', .2), 160); },
  scream() { beep(900, .5, 'sawtooth', .14, -600); beep(1250, .4, 'square', .07, -900); },
  build() { [220, 260, 220, 300].forEach((f, i) => setTimeout(() => beep(f, .08, 'square', .09), i * 90)); },
  climb() { [300, 360, 420].forEach((f, i) => setTimeout(() => beep(f, .07, 'triangle', .07), i * 120)); },
  thud() { beep(120, .15, 'sine', .15, -60); },
  smash() { beep(140, .12, 'square', .12, -80); },

// ===== Byggen (samma kod hos värd och gäst) =====
const ladderTo = (fx, fy, sx, sy) => { const L = ladders.get(fx + ',' + fy); return !!L && L.sx === sx && L.sy === sy; };
function placeLadder(tx, ty, sx, sy) {
  const dx = sx - tx, dy = sy - ty, mesh = makeLadder();
  mesh.position.set((tx + .5 + dx * .4) * T, 0, (ty + .5 + dy * .4) * T); mesh.rotation.y = Math.atan2(dx, dy);
  dyn.add(mesh); ladders.set(tx + ',' + ty, { x:tx, y:ty, sx, sy, mesh });
}
function placeBarricade(x, y, rot) {
  const mesh = makeBarricade(); mesh.position.set((x + .5) * T, 0, (y + .5) * T); mesh.rotation.y = rot ? Math.PI / 2 : 0; dyn.add(mesh);
  grid[y][x] = 5; barricades.push({ x, y, rot, hp:6, mesh });
}
function placeFire(x, y) {
  const mesh = makeFire(); mesh.position.set((x + .5) * T, 0, (y + .5) * T); dyn.add(mesh);
  grid[y][x] = 6; fires.push({ x, y, mesh });
}
function placeTent(x, y) {
  const mesh = makeTent(); mesh.position.set((x + .5) * T, 0, (y + .5) * T); dyn.add(mesh);
  tents.push({ x, y, mesh });
}
function buildsMsg() {
  return { t:'builds', L:[...ladders.values()].map(L => [L.x, L.y, L.sx, L.sy]), B:barricades.map(b => [b.x, b.y, b.rot ? 1 : 0]),
    F:fires.map(f => [f.x, f.y]), T:tents.map(t => [t.x, t.y]) };
}
// Gästen bygger om sina byggen så de matchar värdens
function applyBuilds(d) {
  ladders.forEach(L => dyn.remove(L.mesh));
  [...barricades, ...fires, ...tents].forEach(b => dyn.remove(b.mesh));
  [...barricades, ...fires].forEach(b => grid[b.y][b.x] = 0);
  barricades = []; fires = []; tents = []; ladders = new Map();
  const ok = (x, y) => Number.isInteger(x) && Number.isInteger(y) && x > 0 && y > 0 && x < MW - 1 && y < MH - 1;
  (d.L || []).slice(0, 80).forEach(([x, y, sx, sy]) => { if (ok(x, y) && ok(sx, sy) && isShelf(sx, sy)) placeLadder(x, y, sx, sy); });
  (d.B || []).slice(0, 80).forEach(([x, y, r]) => { if (ok(x, y) && walkable(x, y)) placeBarricade(x, y, !!r); });
  (d.F || []).slice(0, 3).forEach(([x, y]) => { if (ok(x, y) && walkable(x, y)) placeFire(x, y); });
  (d.T || []).slice(0, 40).forEach(([x, y]) => { if (ok(x, y)) placeTent(x, y); });
}
function frontTileFor(q, qyaw) {
  const fx = -Math.sin(qyaw), fy = -Math.cos(qyaw), tx = Math.floor(q.x), ty = Math.floor(q.y);
  return Math.abs(fx) > Math.abs(fy) ? [tx + Math.sign(fx), ty, Math.sign(fx), 0] : [tx, ty + Math.sign(fy), 0, Math.sign(fy)];
}
function tileBusy(x, y) {
  return tents.some(t => t.x === x && t.y === y) || ladders.has(x + ',' + y)
    || chests.some(c => Math.floor(c.x) === x && Math.floor(c.y) === y)
    || [...guards, ...robots].some(o => !o.dead && Math.floor(o.x) === x && Math.floor(o.y) === y)
    || allPlayers().some(q => Math.floor(q.x) === x && Math.floor(q.y) === y);
}
// Värden bygger åt en spelare (sig själv eller en kompis)
function doBuild(q, i, qyaw) {
  const b = BUILDS[i];
  if (!b || q.out || q.sleeping) return;
  if (q.level) return tell(q, 'Du kan inte bygga uppe på hyllan. Hoppa ner först!', '#ccc');
  const [x, y, dx, dy] = frontTileFor(q, qyaw), tx = Math.floor(q.x), ty = Math.floor(q.y);
  if (i === 0) {
    if (!isShelf(x, y)) return tell(q, '🪜 Ställ dig vid en hylla och titta på den för att bygga en stege.', '#ccc');
    if (ladders.has(tx + ',' + ty)) return tell(q, 'Det står redan en stege här.', '#ccc');
    placeLadder(tx, ty, x, y);
  } else {
    if (!walkable(x, y) || grid[y][x] === 4 || tileBusy(x, y)) return tell(q, 'Det går inte att bygga där. Titta mot en tom plats på golvet.', '#ccc');
    if (i === 1) placeBarricade(x, y, !!dx);

    else placeTent(x, y);

}

// ===== Vägkarta (golv + hyllor) så att monstren hittar fram, en per spelare =====
function computeFlows() { alive().forEach(computeFlowFor); }
function computeFlowFor(q) {
  const f0 = Array.from({ length:MH }, () => new Array(MW).fill(1e9)), f1 = Array.from({ length:MH }, () => new Array(MW).fill(1e9));
  const sx = clamp(Math.floor(q.x), 0, MW - 1), sy = clamp(Math.floor(q.y), 0, MH - 1), sl = q.level || 0, qu = [[sx, sy, sl]];
  (sl ? f1 : f0)[sy][sx] = 0;
  for (let i = 0; i < qu.length; i++) {
    const [x, y, l] = qu[i], d = (l ? f1 : f0)[y][x] + 1;
    const push = (nx, ny, nl) => { const F = nl ? f1 : f0; if (F[ny][nx] <= d) return; F[ny][nx] = d; qu.push([nx, ny, nl]); };
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
      if (l === 0) { if (walkable(nx, ny)) push(nx, ny, 0); if (isShelf(nx, ny)) push(nx, ny, 1); }
      else { if (isShelf(nx, ny)) push(nx, ny, 1); if (walkable(nx, ny) && ladderTo(nx, ny, x, y)) push(nx, ny, 0); }
    }
  }
  q.flow0 = f0; q.flow1 = f1;
}
function fireBlocks(ox, oy, nx, ny) {
  return fires.some(f => { const d1 = dist(nx, ny, f.x + .5, f.y + .5); return d1 < FIRE_R && d1 < dist(ox, oy, f.x + .5, f.y + .5); });
}
// Gå ett steg mot spelaren q. Returnerar null om vägen är spärrad.
function chase(o, sp, dt, r, climb, q) {
  if (o.climbT > 0) { o.climbT -= dt; if (o.climbT <= 0) { o.level = 1; o.x = o.cx; o.y = o.cy; } return o.face; }
  if (!q.flow0) return null;
  const l = o.level || 0, tx = Math.floor(o.x), ty = Math.floor(o.y);
  let best = (l ? q.flow1 : q.flow0)[ty]?.[tx] ?? 1e9, nx = -1, ny = -1, nl = l;
  if (best >= 1e9) return null;
  if (best > 0) for (const [dx, dy] of DIRS) {
    const x = tx + dx, y = ty + dy;
    if (x < 0 || y < 0 || x >= MW || y >= MH) continue;
    const opts = l === 0 ? [[walkable(x, y), 0], [climb && isShelf(x, y) && ladderTo(tx, ty, x, y), 1]] : [[isShelf(x, y), 1], [walkable(x, y), 0]];
    for (const [ok, lv] of opts) { if (!ok) continue; const v = (lv ? q.flow1 : q.flow0)[y][x]; if (v < best) { best = v; nx = x; ny = y; nl = lv; } }
  }
  let gx = q.x, gy = q.y;
  if (nx >= 0) {
    if (nl === l) { gx = nx + .5; gy = ny + .5; }
    else if (nl === 1) { // klättra uppför stegen
      if (dist(o.x, o.y, tx + .5, ty + .5) < .15) { o.climbT = 1.6; o.cx = nx + .5; o.cy = ny + .5; return o.face; }
      gx = tx + .5; gy = ty + .5;
    } else { o.level = 0; o.x = nx + .5; o.y = ny + .5; return o.face; } // hoppa ner från hyllan
  }
  const gd = dist(o.x, o.y, gx, gy) || 1, ox = o.x, oy = o.y;
  moveBody(o, (gx - o.x) / gd * sp * dt, (gy - o.y) / gd * sp * dt, r);
  if (o.anomaly && fireBlocks(ox, oy, o.x, o.y)) { o.x = ox; o.y = oy; }
  checkDrop(o, r);
  return Math.atan2(gx - o.x, gy - o.y);
}
function wander(o, sp, dt) {
  const d = dist(o.x, o.y, o.tx, o.ty);

  const m = moveBody(o, (o.tx - o.x) / d * sp * dt, (o.ty - o.y) / d * sp * dt, .35);
  if (m.bx || m.by) newWanderTarget(o);

}
function nearestPlayer(o) {
  let best = null, bd = 1e9;
  for (const q of alive()) { const d = dist(o.x, o.y, q.x, q.y); if (d < bd) { bd = d; best = q; } }
  return best;
}

// ===== Styrning =====
const keys = {};

// Styrspaken syns där tummen är

let toastT = 0;
function toast(text, color = '#fff', dur = 1.8) { const el = $('toast'); el.textContent = text; el.style.color = color; el.style.opacity = 1; toastT = dur; }
// Meddelande till en spelare (tell) eller till alla (say)
function tell(q, text, color, dur) { if (q === p) toast(text, color, dur); else sendTo(q.id, { t:'toast', text, color, dur }); }
function say(text, color, dur) { toast(text, color, dur); sendAll({ t:'toast', text, color, dur }); }

// ===== Det du gör själv =====
function build(i) {
  if (state !== 'play' || p.sleeping || p.out) return;
  if (mode === 'guest') { if (hostConn && hostConn.open) hostConn.send({ t:'build', i, yaw }); return; }
  doBuild(p, i, yaw);
}
function interact() {
  if (state !== 'play' || p.out) return;
  if (p.sleeping) { p.sleeping = false; toast('Du vaknade 🥱', '#9fd0ff'); return; }
  if (p.level) return toast('Hoppa ner från hyllan genom att gå av kanten.', '#ccc');
  if (tents.some(t => dist(t.x + .5, t.y + .5, p.x, p.y) < .8)) {
    p.sleeping = true; p.sleepHealT = 0;
    const safe = fires.some(f => dist(f.x + .5, f.y + .5, p.x, p.y) < FIRE_R);
    const team = others.some(q => !q.out) ? ' Natten går fortare när alla sover.' : '';
    toast((safe ? '💤 Du somnar tryggt vid elden...' : '💤 Du somnar... men det finns ingen eld i närheten!') + team, safe ? '#9fd0ff' : '#ffd23f', 3);
    return;
  }
  toast('Här finns inget att använda. Gå in i ett ⛺ tält och tryck E eller ✋ Använd för att sova.', '#ccc');
}
function shoot() {
  if (state !== 'play' || p.sleeping || p.out) return;
  if (!p.hasGun) { toast('Du har ingen pistol. Leta i kistor 🧰', '#ccc'); return; }
  if (shootCd > 0) return;
  shootCd = .35; kick = 1; muzzle.intensity = 25; sfx.bang();
  if (mode === 'guest') { if (hostConn && hostConn.open) hostConn.send({ t:'shoot', yaw }); }
  else doShoot(p, yaw);
}

// ===== Pistolen (räknas ut hos värden) =====
function poof(x, y, h = 1.2) { makePoof(x, y, h); sendAll({ t:'poof', x, y, h }); }
function makePoof(x, y, h) { const s = sprite('💨', 1.4); s.position.set(x * T, h, y * T); dyn.add(s); poofs.push({ s, t:.8 }); sfx.poof(); }
function doShoot(q, qyaw) {
  const fx = -Math.sin(qyaw), fy = -Math.cos(qyaw);
  let wall = 16;
  for (let t = 0; t < 16; t += .1) {
    const g = grid[Math.floor(q.y + fy * t)]?.[Math.floor(q.x + fx * t)];
    if (g === undefined || g === 1 || g === 3 || (g === 2 && !q.level)) { wall = t; break; }
  }
  let best = null, bt = wall;
  const cands = [
    ...guards.filter(g => !g.dead).map(o => ({ o, kind:'vakt', r:.4 })),
    ...carts.filter(c => c.ghost).map(o => ({ o, kind:'spöke', r:.55 })),
  ];
  for (const c of cands) {
    const dx = c.o.x - q.x, dy = c.o.y - q.y, t = dx * fx + dy * fy;
    if (t <= 0 || t >= bt) continue;
    if (Math.abs(dx * fy - dy * fx) < c.r) { bt = t; best = c; }
  }
  if (!best) return;
  const o = best.o;
  if (best.kind === 'spöke') {
    poof(o.x, o.y, 1.6); o.ghost = false; o.vx = 0; o.mesh.userData.ghost.visible = false; tell(q, 'Spöket är borta! 👻💨', '#45ff8a');
  } else if (o.anomaly) {
    poof(o.x, o.y); o.dead = true; o.respawnT = 30; o.mesh.visible = false; anomaliesStopped++;
    tell(q, 'Rätt! Det var en ANOMALI! ✔', '#45ff8a', 2.5);
  } else {
    q.hasGun = false; sfx.hit();
    tell(q, 'AJ! Hallå! Jag är en RIKTIG vakt! Nu tar jag din pistol! 😠', '#ff4d6d', 3);
    o.cd = 20;
  }
}

// ===== Saker som händer spelare (värden bestämmer) =====
function hurt(q, line) {
  q.lives--; q.sleeping = false;
  if (q === p) localScare(line); else sendTo(q.id, { t:'scare', line });
  guards.forEach(o => { if (o.anomaly) o.cd = Math.max(o.cd, 4); });
  if (q.lives <= 0) {
    q.out = true;
    if (!alive().length) endNight(false);
    else say(q === p ? '👻 Du blev tagen! Kompisarna kämpar vidare...' : `👻 ${q.name} blev tagen!`, '#c9b8ff', 3);
  }
}
function localScare(line) {
  sfx.scream(); shake = .6; p.sleeping = false;
  $('scare').style.display = 'flex';
  toast(line, '#ff4d6d', 2);
  setTimeout(() => $('scare').style.display = 'none', 750);
}
function push(q, vx, vy, st, text, color) {
  if (q === p) { p.vx = vx; p.vy = vy; stun = st; shake = .3; sfx.hit(); toast(text, color); }
  else sendTo(q.id, { t:'push', vx, vy, st, text, color });
}
function wake(q, danger) {
  q.sleeping = false;
  if (q === p) { if (danger) { toast('Du vaknade! Något är nära! 😱', '#ff4d6d', 2.5); sfx.heart(); } }
  else sendTo(q.id, { t:'wake', danger:!!danger });
}

// ===== Uppdatering =====
const SPEED = 3.3;
function update(dt) {
  if (state !== 'play') return;
  shootCd -= dt;
  movePlayer(dt);
  if (mode === 'guest') {
    netT -= dt;
    if (netT <= 0 && hostConn && hostConn.open) { netT = .05; hostConn.send({ t:'p', x:p.x, y:p.y, level:p.level, yaw, sleeping:p.sleeping }); }
  } else {
    simulate(dt);
    if (mode === 'host' && state === 'play') { netT -= dt; if (netT <= 0) { netT = .066; sendAll(snapshot()); } }
  }
  localAudio(dt);
}

// Din egen spelare: gå, titta, klättra (samma för alla)
function movePlayer(dt) {
  if (keys['arrowleft']) yaw += 2.4 * dt;
  if (keys['arrowright']) yaw -= 2.4 * dt;
  let mv = 0, st = 0;
  if (keys['w'] || keys['arrowup']) mv++;
  if (keys['s'] || keys['arrowdown']) mv--;
  if (keys['a']) st--;
  if (keys['d']) st++;
  if (joy.on) { st = clamp((joy.x - joy.ox) / 50, -1, 1); mv = clamp(-(joy.y - joy.oy) / 50, -1, 1); }
  const l = Math.hypot(mv, st); if (l > 1) { mv /= l; st /= l; }
  if (stun > 0) { stun -= dt; mv = st = 0; }
  if (p.sleeping) mv = st = 0;
  const fx = -Math.sin(yaw), fy = -Math.cos(yaw), rx = -fy, ry = fx;
  const slippery = !p.level && puddles.some(pd => dist(pd.x, pd.y, p.x, p.y) < .6);
  const k = stun > 0 ? 3 : slippery ? 1.2 : 12;
  p.vx += ((fx * mv + rx * st) * SPEED - p.vx) * Math.min(1, k * dt);
  p.vy += ((fy * mv + ry * st) * SPEED - p.vy) * Math.min(1, k * dt);
  moveBody(p, p.vx * dt, p.vy * dt, .3);
  p.yaw = yaw;
  if (checkDrop(p, .3)) { sfx.thud(); shake = .15; if (mode !== 'guest') computeFlowFor(p); }
  if (Math.hypot(p.vx, p.vy) > .5) bob += dt * 9;
  // Klättra upp: stå vid en stege och gå mot hyllan
  const L = !p.level && ladders.get(Math.floor(p.x) + ',' + Math.floor(p.y));
  const [ftx, fty] = frontTileFor(p, yaw);
  if (L && mv > 0 && L.sx === ftx && L.sy === fty) {
    climbT += dt;
    if (climbT > .3) {
      climbT = 0; p.level = 1; p.x = L.sx + .5; p.y = L.sy + .5; p.vx = p.vy = 0; sfx.climb();
      if (mode !== 'guest') computeFlowFor(p);
      if (!climbedOnce) { climbedOnce = true; toast('🪜 Du är uppe på hyllan! Gå av kanten för att hoppa ner.', '#45ff8a', 3); }
    }
  } else climbT = 0;
}

// Hela världen (bara hos värden eller när man spelar ensam)
function simulate(dt) {
  const awake = alive();
  const allSleep = awake.length > 0 && awake.every(q => q.sleeping);
  time += allSleep ? dt * 4 : dt;
  if (time >= nightLen) return endNight(true);
  blackout -= dt; nextBlackout -= dt;
  if (nextBlackout <= 0) { blackout = rand(.9, 1.4); nextBlackout = rand(7, 13) - Math.min(night, 4); sfx.creak(); }

  // Sova i tältet: få tillbaka hjärtan, vakna om något är nära
  for (const q of awake) {
    q.hintT -= dt;
    if (!q.sleeping) continue;
    q.sleepHealT += dt * (allSleep ? 4 : 1);
    if (q.sleepHealT >= 25) { q.sleepHealT = 0; if (q.lives < 3) { q.lives++; tell(q, 'Du vilade dig ❤️ +1', '#ff6b8a'); } }
    const safe = fires.some(f => dist(f.x + .5, f.y + .5, q.x, q.y) < FIRE_R);
    const danger = guards.some(g => g.anomaly && !g.dead && dist(g.x, g.y, q.x, q.y) < (safe ? 1.5 : 5));
    if (danger || !tents.some(t => dist(t.x + .5, t.y + .5, q.x, q.y) < .8)) wake(q, danger);
  }
  // Varor och kistor, för varje spelare
  for (const q of awake) {
    if (q.level) continue;
    for (const s of slots) {
      if (s.taken || dist(s.tx + .5, s.ty + .5, q.x, q.y) > .8) continue;
      const want = list.find(l => l.slot === s && !l.got);
      if (want) {
        want.got = true; s.taken = true; dyn.remove(s.sprite); sfx.pick();
        say(q === p ? `${s.e} ${s.name} ✔` : `${q.name} hittade ${s.e} ${s.name} ✔`, '#45ff8a');
        renderList();
        if (list.every(l => l.got) && !listDoneShown) { listDoneShown = true; setTimeout(() => say('Listan är klar! ⭐ Nu gäller det att överleva till 06:00!', '#ffd23f', 3), 900); }
      } else if (q.hintT <= 0) { q.hintT = 2.5; tell(q, `${s.e} Inte på listan`, '#bbb'); }
    }
    for (const c of chests) {
      if (c.open || dist(c.x, c.y, q.x, q.y) > .95) continue;
      openChestMesh(c); sfx.chest();
      if (!q.hasGun) { q.hasGun = true; tell(q, '🧰 En PISTOL! 🔫 Den tar aldrig slut. Skjut med 💥-knappen, musklick eller mellanslag', '#ffd23f', 3.5); }
      else if (q.lives < 3) { q.lives++; tell(q, '🧰 Ett extra hjärta! ❤️', '#ff6b8a'); }
      else tell(q, '🧰 Kistan var tom... du har redan allt!', '#ccc');
    }
  }

  if (chestT <= 0) { chestT = 35; if (chests.filter(c => !c.open).length < 3) { addChest(); say('✨ En ny kista har dykt upp någonstans!', '#ffd23f', 2.5); } }
  // Spökkundvagnar
  for (const c of carts) {
    if (!c.ghost) continue;
    c.cd -= dt; c.x += c.vx * dt;
    if (solid(c.x + Math.sign(c.vx) * .6, c.y)) c.vx *= -1;
    if (c.cd > 0) continue;
    const q = awake.find(q => !q.level && dist(c.x, c.y, q.x, q.y) < .7);
    if (q) { c.cd = 1.5; push(q, Math.sign(c.vx) * 7, (q.y < c.y ? -1 : 1) * 3, .4, 'Hihihi! 👻', '#c9b8ff'); }
  }
  // Städrobotar
  for (const r of robots) {
    r.cd -= dt; r.drop -= dt;
    r.face = wander(r, 1.4, dt);
    if (r.drop <= 0) { r.drop = rand(2.5, 4.5); if (puddles.length < 14) addPuddle(r.x, r.y, 14); }
    if (r.cd > 0) continue;
    const q = awake.find(q => !q.level && dist(r.x, r.y, q.x, q.y) < .7);
    if (q) { r.cd = 1.5; push(q, (q.x - r.x) * 6, (q.y - r.y) * 6, .3, 'STÄÄÄDA... DIG... 🤖', '#ff4d6d'); }
  }
  puddles.forEach(pd => { pd.t -= dt; pd.mesh.material.opacity = Math.min(.6, pd.t / 4); if (pd.t <= 0) dyn.remove(pd.mesh); });
  puddles = puddles.filter(pd => pd.t > 0);

  flowT -= dt; if (flowT <= 0) { flowT = .25; computeFlows(); }

  // Vakter: riktiga är snälla, anomalier anfaller den som är närmast
  for (const g of guards) {
    if (g.dead) {
      g.respawnT -= dt;
      if (g.respawnT <= 0) { // en ny vakt kommer till jobbet... men är den riktig?
        dyn.remove(g.mesh);
        g.anomaly = pick(ANOMALIES); g.mesh = makeGuard(g.anomaly); dyn.add(g.mesh);
        [g.x, g.y] = farTile(12); g.level = 0; g.climbT = 0; g.dead = false; g.cd = 3; newWanderTarget(g);
        say('👮 En ny vakt har börjat jobba... är den riktig?', '#9fd0ff', 2.5);
      }
      continue;
    }
    g.cd -= dt;
    const q = nearestPlayer(g);
    if (!q) { g.face = wander(g, 1.1, dt); continue; }
    const d = dist(g.x, g.y, q.x, q.y);
    const range = g.anomaly ? (blackout > 0 ? 12 : 7) : 5;
    const hunting = g.anomaly && (g.climbT > 0 || g.level > 0);
    const sameLevel = (g.level || 0) === (q.level || 0);
    if (!g.anomaly && (q.level || g.level)) { g.face = wander(g, 1.1, dt); continue; }
    if (g.cd <= 0 && (hunting || d < range && (blackout > 0 && g.anomaly || lineOfSight(g.x, g.y, q.x, q.y, !!(q.level || g.level))))) {
      if (d > (g.anomaly ? .6 : 1.3) || !sameLevel) {
        const f = chase(g, g.anomaly ? (blackout > 0 ? 2.6 : 1.8 + night * .08) : 1.5, dt, .3, !!g.anomaly, q);
        if (f !== null) g.face = f;
        else if (g.anomaly) smashTowards(g, q, d, dt);
        else g.face = wander(g, 1.1, dt);
      } else if (g.anomaly) {
        hurt(q, pick(BOO_LINES)); g.cd = 8; g.level = 0; g.climbT = 0; [g.x, g.y] = farTile(12);
        if (state !== 'play') return;
      } else {
        g.face = Math.atan2(q.x - g.x, q.y - g.y);
        let msg = pick(GUARD_HELLO);
        if (!g.gave && q.lives < 3) { g.gave = true; q.lives++; msg += ' Här, ta ett plåster! ❤️ +1'; sfx.pick(); }
        tell(q, '👮 ' + msg, '#9fd0ff', 2.5); g.cd = 15;
      }
    } else g.face = wander(g, 1.1, dt);
  }
}
// Vägen är spärrad: gå rakt mot spelaren och slå sönder barrikader
function smashTowards(g, q, d, dt) {
  const ox = g.x, oy = g.y;
  moveBody(g, (q.x - g.x) / (d || 1) * 1.2 * dt, (q.y - g.y) / (d || 1) * 1.2 * dt, .3);
  if (fireBlocks(ox, oy, g.x, g.y)) { g.x = ox; g.y = oy; }
  g.face = Math.atan2(q.x - g.x, q.y - g.y);
  const b = barricades.find(b => dist(b.x + .5, b.y + .5, g.x, g.y) < 1.25);
  if (!b) return;
  b.hp -= dt; g.bangT -= dt;
  if (g.bangT <= 0) { g.bangT = .5; sfx.smash(); b.mesh.rotation.z = rand(-.05, .05); }
  if (b.hp <= 0) {
    dyn.remove(b.mesh); grid[b.y][b.x] = 0; barricades = barricades.filter(o => o !== b);
    poof(b.x + .5, b.y + .5); say('💥 En anomali slog sönder en barrikad!', '#ff4d6d', 2.5);
    sendAll(buildsMsg()); computeFlows();
  }
}
// Steg och hjärtslag när en anomali är nära dig
function localAudio(dt) {

    if (!g.anomaly || g.dead) continue;
    const d = dist(g.x, g.y, p.x, p.y);
    if (d < nearest) { nearest = d; moving = Math.hypot(g.x - (g.lx ?? g.x), g.y - (g.ly ?? g.y)) > .0005; }

}

const mini = $('mini'), mctx = mini.getContext('2d');
// Hos gästen glider saker mjukt mot värdens position
function vis(o, dt, always = false) {
  if (mode !== 'guest' && !always) return [o.x, o.y];
  if (o.rx === undefined || Math.hypot(o.x - o.rx, o.y - o.ry) > 3) { o.rx = o.x; o.ry = o.y; }
  const k = Math.min(1, dt * 12);
  o.rx += (o.x - o.rx) * k; o.ry += (o.y - o.ry) * k;
  return [o.rx, o.ry];
}
function render(now, dt) {
  const sx = shake > 0 ? rand(-.08, .08) : 0, sy = shake > 0 ? rand(-.08, .08) : 0;
  shake = Math.max(0, shake - dt);
  const eyeTarget = p.level ? shelfH(Math.floor(p.x), Math.floor(p.y)) + EYE * .85 : p.sleeping ? .5 : EYE;
  camY += (eyeTarget - camY) * Math.min(1, dt * 8);
  camera.position.set(p.x * T + sx, camY + Math.sin(bob) * .05 + sy, p.y * T);
  camera.rotation.set(pitch, yaw, 0);
  const bo = isBlackout();
  flash.intensity = bo || p.out ? 0 : 30;
  amb.intensity = bo ? .03 : p.out ? .8 : .5;
  muzzle.intensity = Math.max(0, muzzle.intensity - dt * 300);
  for (const g of guards) {
    const [gx, gz] = vis(g, dt), tx = Math.floor(gx), ty = Math.floor(gz);
    const climb = mode === 'guest' ? (g.climb || 0) : g.climbT > 0 ? 1 - g.climbT / 1.6 : 0;
    const gy = climb > 0 ? climb * 1.8 : g.level ? shelfH(tx, ty) : 0;
    g.mesh.position.set(gx * T, gy, gz * T);
    g.mesh.rotation.y = g.face || 0;
    g.mesh.children[0].position.y = (g.anomaly === 'svävar' ? .45 + Math.sin(now / 400) * .1 : 0);
  }
  for (const r of robots) { const [x, y] = vis(r, dt); r.mesh.position.set(x * T, 0, y * T); r.mesh.rotation.y = r.face || 0; }
  for (const c of carts) {
    const [x, y] = vis(c, dt);
    c.mesh.position.set(x * T, 0, y * T);
    c.mesh.userData.ghost.position.y = 1.6 + Math.sin(now / 200 + c.y) * .12;
  }
  for (const q of others) {
    if (!q.mesh) { q.mesh = makeAvatar(q.name, COLORS[q.color] || '#fff'); avatarGroup.add(q.mesh); }
    const [x, y] = vis(q, dt, true);
    q.mesh.position.set(x * T, q.level ? shelfH(Math.floor(x), Math.floor(y)) : 0, y * T);
    q.mesh.rotation.y = (q.yaw || 0) + Math.PI;
    const { body, ghost, light } = q.mesh.userData;
    body.visible = !q.out; ghost.visible = q.out; light.intensity = q.out || q.sleeping ? 0 : 14;
    body.rotation.x = q.sleeping ? -Math.PI / 2 : 0; body.position.y = q.sleeping ? .3 : 0;
  }
  for (const c of chests) if (!c.open) c.mesh.userData.sparkle.position.y = 1 + Math.sin(now / 300 + c.x) * .1;
  for (const f of fires) {
    const { flame, light } = f.mesh.userData;
    light.intensity = 5 + Math.sin(now / 90) * 1.2 + Math.random() * .8;
    flame.scale.setScalar(1 + Math.sin(now / 120) * .1);
  }
  poofs.forEach(f => { f.t -= dt; f.s.material.opacity = Math.max(0, f.t / .8); f.s.position.y += dt; if (f.t <= 0) dyn.remove(f.s); });
  poofs = poofs.filter(f => f.t > 0);
  const pulse = 1 + Math.sin(now / 250) * .12;
  list.forEach(l => { if (!l.got) l.slot.sprite.scale.setScalar(.8 * pulse); });
  renderer.render(scene, camera);
  drawMinimap(now);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').style.opacity = 0; }
  const playing = state === 'play';
  $('hint').style.display = playing && !isTouch && document.pointerLockElement !== cv ? 'block' : 'none';
  $('joyHint').style.display = playing && isTouch && time < 15 && !joy.on ? 'block' : 'none';
  if (!playing && joy.on) { joy.on = false; joy.id = null; drawJoy(); }
  kick = Math.max(0, kick - dt * 6);
  const gun = $('gun');
  gun.style.display = playing && p.hasGun && !p.sleeping && !p.out ? 'block' : 'none';
  gun.style.transform = `translate(${-kick * 20}px, ${Math.sin(bob) * 8 + kick * 30}px) scaleX(-1) rotate(${-10 - kick * 25}deg)`;
  $('shootBtn').style.display = isTouch && playing && p.hasGun && !p.out ? 'flex' : 'none';
  $('buildbar').style.display = playing && !p.out ? 'flex' : 'none';
  $('sleep').style.display = playing && p.sleeping ? 'flex' : 'none';
  $('outOverlay').style.display = playing && p.out ? 'block' : 'none';
}

function drawMinimap(now) {
  const m = innerWidth < 600 ? 3 : 4;
  if (mini.width !== MW * m) { mini.width = MW * m; mini.height = MH * m; }
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const g = grid[y][x], r = room[y][x];
    mctx.fillStyle = g === 1 ? '#2a2250' : g === 2 ? '#6b4a2e' : g === 3 ? '#8a2b3c' : g === 5 ? '#c98b4a' : g === 6 ? '#ff7a2a' : r >= 0 ? SHOPS[r].floor : '#888';
    mctx.fillRect(x * m, y * m, m, m);
  }
  if (Math.sin(now / 150) > 0) {
    mctx.fillStyle = '#ff9d00';
    list.forEach(l => { if (!l.got) mctx.fillRect(l.slot.tx * m - 1, l.slot.ty * m - 1, m + 2, m + 2); });
  }
  mctx.fillStyle = '#ffe14d'; ladders.forEach(L => mctx.fillRect(L.x * m + m / 4, L.y * m + m / 4, m / 2, m / 2));
  mctx.fillStyle = '#2ecc71'; tents.forEach(t => mctx.fillRect(t.x * m, t.y * m, m, m));
  for (const q of others) { mctx.fillStyle = COLORS[q.color] || '#fff'; mctx.beginPath(); mctx.arc((q.rx ?? q.x) * m, (q.ry ?? q.y) * m, m * .8, 0, 7); mctx.fill(); }
  const px = p.x * m, py = p.y * m;
  mctx.strokeStyle = COLORS[p.color] || '#ff3df0'; mctx.lineWidth = 2;
  mctx.beginPath(); mctx.moveTo(px, py); mctx.lineTo(px - Math.sin(yaw) * m * 2.5, py - Math.cos(yaw) * m * 2.5); mctx.stroke();
  mctx.fillStyle = COLORS[p.color] || '#ff3df0'; mctx.beginPath(); mctx.arc(px, py, m * .9, 0, 7); mctx.fill();
}

// ===== Nätverk (PeerJS, samma sätt som Monsterfabriken) =====
let mode = 'solo', peer = null, hostConn = null, roomCode = '', netMsg = '', lobbyNames = [];
const conns = new Map();
const PREFIX = 'nils-kc-';
const KODTECKEN = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const nyKod = () => Array.from({ length:4 }, () => KODTECKEN[Math.random() * KODTECKEN.length | 0]).join('');
function netStatus(t) { netMsg = t; const el = $('netStatus'); if (el) el.textContent = t; }
function sendAll(m) { if (mode !== 'host') return; conns.forEach(c => { if (c.open) c.send(m); }); }
function sendTo(id, m) { const c = conns.get(id); if (c && c.open) c.send(m); }
function sendLobby() { sendAll({ t:'lobby', code:roomCode, night, names:allPlayers().map(q => [q.name, q.color]) }); }
function worldFor(q) {
  return { t:'world', night, nightLen, spawn:[q.x, q.y], slots:slots.map(s => [s.tx, s.ty, s.dir, s.e, s.name]),
    list:list.map(l => [slots.indexOf(l.slot), l.who]) };
}
function leaveNet() {
  if (mode === 'host') sendAll({ t:'bye' });
  conns.forEach(c => { try { c.close(); } catch (e) {} }); conns.clear();
  if (hostConn) { try { hostConn.close(); } catch (e) {} hostConn = null; }
  if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
  mode = 'solo'; roomCode = ''; lobbyNames = [];
  others.forEach(q => q.mesh && avatarGroup.remove(q.mesh)); others = [];
  p.id = 'host'; p.color = 0;
}
function hostRoom() {
  if (typeof Peer === 'undefined') return netStatus('Online-delen kunde inte laddas. Kolla internet och ladda om sidan.');
  leaveNet(); mode = 'host'; roomCode = nyKod(); netMsg = 'Skapar rum...';
  renderMenu();
  peer = new Peer(PREFIX + roomCode);
  peer.on('open', () => { netMsg = 'Väntar på kompisar...'; renderMenu(); sfx.join(); });
  peer.on('connection', c => {
    c.on('open', () => {
      if (state === 'play' || conns.size >= 3) { c.send({ t:'full', play:state === 'play' }); setTimeout(() => c.close(), 500); return; }
      conns.set(c.peer, c);
    });
    c.on('data', d => onHostData(c.peer, d));
    c.on('close', () => dropPlayer(c.peer));
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') return hostRoom();
    netStatus('Hoppsan, något gick fel: ' + e.type);
  });
}
function joinRoom(code) {
  if (typeof Peer === 'undefined') return netStatus('Online-delen kunde inte laddas. Kolla internet och ladda om sidan.');
  if (!/^[A-Z0-9]{4}$/.test(code)) return netStatus('Skriv in kompisens kod med 4 tecken först!');
  leaveNet(); mode = 'guest'; roomCode = code; netMsg = 'Letar efter rummet ' + code + '...';
  renderMenu();
  peer = new Peer();
  peer.on('open', id => {
    p.id = id;
    hostConn = peer.connect(PREFIX + code, { reliable:true });
    hostConn.on('open', () => { hostConn.send({ t:'hello', name:myName }); netMsg = 'Ansluten! 🎉'; renderMenu(); sfx.join(); });
    hostConn.on('data', onGuestData);
    hostConn.on('close', () => {
      if (mode !== 'guest') return;
      leaveNet(); netMsg = 'Värden lämnade rummet.'; menu();
    });
  });
  peer.on('error', e => {
    netMsg = e.type === 'peer-unavailable' ? `Hittade inget rum med koden ${code}. Stämmer den?` : 'Hoppsan, något gick fel: ' + e.type;
    leaveNet(); renderMenu();
  });
}
function dropPlayer(id) {
  conns.delete(id);
  const q = others.find(o => o.id === id);
  if (!q) return;
  if (q.mesh) avatarGroup.remove(q.mesh);
  others = others.filter(o => o !== q);
  if (state === 'menu') { renderMenu(); sendLobby(); }
  else if (state === 'play') say(`👋 ${q.name} lämnade spelet.`, '#9fd0ff', 2.5);
}
// Värden tar emot från en kompis
function onHostData(id, d) {
  if (!d || typeof d !== 'object') return;
  let q = others.find(o => o.id === id);
  if (d.t === 'hello') {
    if (q || others.length >= 3) return;
    const used = allPlayers().map(o => o.color);
    const color = [1, 2, 3].find(c => !used.includes(c)) ?? 1;
    q = newPlayer(id, String(d.name || 'Kompis').replace(/[<>]/g, '').slice(0, 12) || 'Kompis', color);
    others.push(q);
    if (state === 'menu') setupNight(); // listan och vakterna anpassas till antal spelare
    renderMenu(); sendLobby(); sfx.join();
    return;
  }
  if (!q) return;
  if (d.t === 'p') {
    q.x = num(d.x, .3, MW - .3, q.x); q.y = num(d.y, .3, MH - .3, q.y);
    const lv = d.level ? 1 : 0;
    if (lv !== q.level) { q.level = lv; computeFlowFor(q); }
    q.yaw = num(d.yaw, -1e4, 1e4, 0);
    if (!q.out) q.sleeping = !!d.sleeping && tents.some(t => dist(t.x + .5, t.y + .5, q.x, q.y) < .9);
  } else if (d.t === 'shoot' && state === 'play' && q.hasGun && !q.out) doShoot(q, num(d.yaw, -1e4, 1e4, 0));
  else if (d.t === 'build' && state === 'play') doBuild(q, num(d.i, 0, 3, 0) | 0, num(d.yaw, -1e4, 1e4, 0));
}
// Gästen tar emot från värden
function onGuestData(d) {
  if (!d || typeof d !== 'object') return;
  switch (d.t) {
    case 'lobby':
      lobbyNames = (Array.isArray(d.names) ? d.names : []).slice(0, 4).map(([n, c]) => [String(n).slice(0, 12), num(c, 0, 3) | 0]);
      night = num(d.night, 1, 999, night) | 0;
      if (state === 'menu') renderMenu();
      break;
    case 'full':
      netMsg = d.play ? 'De spelar redan en natt. Försök igen när natten är slut!' : 'Rummet är fullt (max 4 spelare).';
      leaveNet(); renderMenu(); break;
    case 'bye': leaveNet(); netMsg = 'Värden lämnade rummet.'; menu(); break;
    case 'world': setupGuestNight(d); break;
    case 'start': hide(); state = 'play'; beep(440, .05); if (!isTouch) lockMouse(); break;
    case 's': if (state === 'play') applySnapshot(d); break;
    case 'builds': applyBuilds(d); break;
    case 'toast': toast(String(d.text || '').slice(0, 140), /^#[0-9a-fA-F]{3,6}$/.test(d.color) ? d.color : '#fff', num(d.dur, .5, 5, 1.8)); break;
    case 'poof': makePoof(num(d.x, 0, MW), num(d.y, 0, MH), num(d.h, 0, 4, 1.2)); break;
    case 'scare': localScare(String(d.line || 'BÖÖ!').slice(0, 60)); break;
    case 'push': p.vx = num(d.vx, -10, 10); p.vy = num(d.vy, -10, 10); stun = num(d.st, 0, 1); shake = .3; sfx.hit(); toast(String(d.text || '').slice(0, 60), /^#[0-9a-fA-F]{3,6}$/.test(d.color) ? d.color : '#fff'); break;
    case 'wake': p.sleeping = false; if (d.danger) { toast('Du vaknade! Något är nära! 😱', '#ff4d6d', 2.5); sfx.heart(); } break;
    case 'end': if (state === 'play') showResult(d); break;
  }
}
function setupGuestNight(w) {
  clearWorld();
  night = num(w.night, 1, 999, 1) | 0; nightLen = num(w.nightLen, 60, 999, 180);
  (Array.isArray(w.slots) ? w.slots : []).slice(0, 80).forEach(([tx, ty, dir, e, name]) => {
    if (!Number.isInteger(tx) || !Number.isInteger(ty) || tx < 0 || ty < 0 || tx >= MW || ty >= MH) return;
    addSlot(tx, ty, dir === -1 ? -1 : 1, String(e).slice(0, 8), String(name).slice(0, 20));
  });
  list = (Array.isArray(w.list) ? w.list : []).slice(0, 20).map(([i, who]) => slots[i] ? { slot:slots[i], who:who === 'pappa' ? 'pappa' : 'mamma', got:false } : null).filter(Boolean);
  greyOutOthers();
  resetPlayer(p, 0);
  const sp = Array.isArray(w.spawn) ? w.spawn : [];
  p.x = p.rx = num(sp[0], 1, MW - 1, 2.5); p.y = p.ry = num(sp[1], 1, MH - 1, 13);
  others.forEach(q => q.mesh && avatarGroup.remove(q.mesh)); others = [];
  renderList();
}
// Värdens bild av världen, 15 gånger i sekunden
function snapshot() {
  const r2 = v => Math.round(v * 100) / 100;
  return { t:'s', time:r2(time), bl:blackout > 0 ? 1 : 0, st:anomaliesStopped,
    g:guards.map(g => [r2(g.x), r2(g.y), g.level || 0, r2(g.face || 0), g.dead ? 1 : 0, g.anomaly ? ANOMALIES.indexOf(g.anomaly) : -1, g.climbT > 0 ? r2(1 - g.climbT / 1.6) : 0]),
    c:carts.map(c => [r2(c.x), r2(c.y), c.ghost ? 1 : 0]),
    r:robots.map(r => [r2(r.x), r2(r.y), r2(r.face || 0)]),
    pd:puddles.map(pd => [r2(pd.x), r2(pd.y), r2(pd.t)]),
    ch:chests.map(c => [r2(c.x), r2(c.y), c.open ? 1 : 0]),
    got:list.map(l => l.got ? 1 : 0),
    pl:allPlayers().map(q => [q.id, q.name, r2(q.x), r2(q.y), q.level || 0, r2(q === p ? yaw : q.yaw), q.lives, q.hasGun ? 1 : 0, q.sleeping ? 1 : 0, q.out ? 1 : 0, q.color]) };
}
function applySnapshot(s) {
  const arr = (a, n) => Array.isArray(a) ? a.slice(0, n) : [];
  time = num(s.time, 0, 9999, time);
  const bl = !!s.bl; if (bl && !netBlackout) sfx.creak(); netBlackout = bl;
  anomaliesStopped = num(s.st, 0, 999) | 0;
  // Vakter
  const G = arr(s.g, 12);
  G.forEach((a, i) => {
    const k = num(a[5], -1, ANOMALIES.length - 1, -1) | 0, anomaly = k >= 0 ? ANOMALIES[k] : null;
    let g = guards[i];
    if (!g || g.anomaly !== anomaly) { if (g) dyn.remove(g.mesh); g = guards[i] = { anomaly, mesh:makeGuard(anomaly) }; dyn.add(g.mesh); }
    g.x = num(a[0], 0, MW); g.y = num(a[1], 0, MH); g.level = a[2] ? 1 : 0; g.face = num(a[3], -1e4, 1e4); g.dead = !!a[4]; g.climb = num(a[6], 0, 1);
    g.mesh.visible = !g.dead;
  });
  guards.splice(G.length).forEach(g => dyn.remove(g.mesh));
  // Kundvagnar och robotar
  const C = arr(s.c, 8);
  C.forEach((a, i) => {
    let c = carts[i]; if (!c) { c = carts[i] = { mesh:makeCart() }; dyn.add(c.mesh); }
    c.x = num(a[0], 0, MW); c.y = num(a[1], 0, MH); c.ghost = !!a[2]; c.mesh.userData.ghost.visible = c.ghost;
  });
  carts.splice(C.length).forEach(c => dyn.remove(c.mesh));
  const R = arr(s.r, 5);
  R.forEach((a, i) => {
    let r = robots[i]; if (!r) { r = robots[i] = { mesh:makeRobot() }; dyn.add(r.mesh); }
    r.x = num(a[0], 0, MW); r.y = num(a[1], 0, MH); r.face = num(a[2], -1e4, 1e4);
  });
  robots.splice(R.length).forEach(r => dyn.remove(r.mesh));
  // Pölar
  const P = arr(s.pd, 20);
  while (puddles.length > P.length) dyn.remove(puddles.pop().mesh);
  P.forEach((a, i) => {
    const x = num(a[0], 0, MW), y = num(a[1], 0, MH);
    const pd = puddles[i] || addPuddle(x, y, 14);
    pd.x = x; pd.y = y; pd.t = num(a[2], 0, 20); pd.mesh.position.set(x * T, .02, y * T); pd.mesh.material.opacity = Math.min(.6, pd.t / 4);
  });
  // Kistor
  arr(s.ch, 30).forEach((a, i) => {
    if (!chests[i]) addChest(num(a[0], 0, MW), num(a[1], 0, MH));
    if (a[2] && !chests[i].open) openChestMesh(chests[i]);
  });
  // Inköpslistan
  let changed = false;
  arr(s.got, 20).forEach((v, i) => { const l = list[i]; if (l && v && !l.got) { l.got = true; l.slot.taken = true; dyn.remove(l.slot.sprite); changed = true; } });
  if (changed) renderList();
  // Spelare
  const seen = new Set();
  arr(s.pl, 4).forEach(a => {
    const id = String(a[0]).slice(0, 64);
    if (id === p.id) {
      p.lives = num(a[6], 0, 3) | 0; p.hasGun = !!a[7]; p.out = !!a[9]; p.color = num(a[10], 0, 3) | 0;
      return;
    }
    seen.add(id);
    let q = others.find(o => o.id === id);
    if (!q) { q = newPlayer(id, String(a[1]).slice(0, 12), num(a[10], 0, 3) | 0); q.x = q.rx = num(a[2], 0, MW); q.y = q.ry = num(a[3], 0, MH); others.push(q); }
    q.x = num(a[2], 0, MW); q.y = num(a[3], 0, MH); q.level = a[4] ? 1 : 0; q.yaw = num(a[5], -1e4, 1e4);
    q.lives = num(a[6], 0, 3) | 0; q.hasGun = !!a[7]; q.sleeping = !!a[8]; q.out = !!a[9];
  });
  others = others.filter(q => { if (seen.has(q.id)) return true; if (q.mesh) avatarGroup.remove(q.mesh); return false; });
}

// ===== Skärmar =====
function show(html) { $('screen').innerHTML = `<div class="box">${html}</div>`; $('screen').classList.remove('hidden'); if (document.pointerLockElement) document.exitPointerLock(); }
function hide() { $('screen').classList.add('hidden'); }
function notes() {
  const n = who => list.filter(l => l.who === who).map(l => `${esc(l.slot.e)} ${esc(l.slot.name)}`).join('<br>');
  return `<div class="notes"><div class="note"><b>👩 Mammas lista</b>${n('mamma')}</div><div class="note"><b>👨 Pappas lista</b>${n('pappa')}</div></div>`;
}
function menu() {
  state = 'menu';
  if (mode !== 'guest') setupNight();
  renderMenu(); updateHud(); sendLobby();
}
function renderMenu() {
  if (state !== 'menu') return;
  const best = save0.best ? `<p>🏆 Ditt rekord: natt ${save0.best}</p>` : '';
  const ctrl = isTouch
    ? '🎮 Dra med vänster tumme för att gå, dra med höger tumme för att titta. Skjut med 💥-knappen. Bygg med knapparna längst ner.'
    : '🎮 Gå med WASD, titta med musen (klicka först). Skjut med vänster musknapp eller mellanslag. Esc släpper musen.';
  const chip = (name, color) => `<span style="color:${COLORS[color] || '#fff'}">${esc(name)}</span>`;
  let online;
  if (mode === 'solo') {
    online = `<div class="online"><h3>👫 Spela med kompisar online</h3>
      <p>Ditt namn: <input id="nameIn" maxlength="12" value="${esc(myName)}"></p>
      <button class="btn alt small" id="hostBtn">Skapa rum</button>
      <span style="margin:0 6px">eller skriv kompisens kod:</span>
      <input id="codeIn" maxlength="4" placeholder="KOD" style="width:100px;text-transform:uppercase">
      <button class="btn alt small" id="joinBtn">Gå med</button>
      <div id="netStatus">${esc(netMsg)}</div></div>`;
  } else if (mode === 'host') {
    online = `<div class="online"><h3>👫 Ditt rum</h3>
      ${peer && peer.open ? `<div>Ge koden till dina kompisar:</div><div class="code">${roomCode}</div>` : ''}
      <div class="players">${allPlayers().map(q => chip(q.name, q.color)).join('')}</div>
      <button class="btn red small" id="leaveBtn">Lämna rummet</button>
      <div id="netStatus">${esc(netMsg)}</div></div>`;
  } else {
    online = `<div class="online"><h3>👫 Rum ${esc(roomCode)}</h3>
      <div class="players">${lobbyNames.map(([n, c]) => chip(n, c)).join('')}</div>
      <p>⏳ Väntar på att värden startar natten...</p>
      <button class="btn red small" id="leaveBtn">Lämna rummet</button>
      <div id="netStatus">${esc(netMsg)}</div></div>`;
  }
  const startBtn = mode === 'guest' ? '' : `<button class="btn" id="goBtn">${others.length ? 'Starta natten för alla 🔦' : 'Starta natten 🔦'}</button>`;
  show(`<div id="rotate">📱 Vänd skärmen på längden, då ser du mer!</div><h1>🌙 Natt ${night}</h1>
    <p>Oj nej! Du blev inlåst i köpcentret! Mamma och pappa kan hämta dig först klockan <b>06:00</b>. Överlev natten! Hinner du handla allt på listan får du en extra stjärna.</p>
    ${mode === 'guest' ? '' : notes()}${best}${startBtn}${online}
    <div class="tips">
      ${ctrl}<br>
      🧰 Leta efter kistor i affärerna! Där finns pistolen (den tar aldrig slut) och extra hjärtan.<br>
      🔨 <b>Bygg</b> gratis med ${isTouch ? 'knapparna längst ner' : 'tangenterna 1 till 4'}:
      🪜 <b>Stege</b> (titta på en hylla) så kan du klättra upp. Anomalierna kan också klättra, men långsamt!
      🧱 <b>Barrikad</b> stoppar anomalierna en stund.
      🔥 <b>Lägereld</b>: anomalierna vågar inte gå nära elden.
      ⛺ <b>Tält</b>: gå in och tryck ${isTouch ? '✋ Använd' : 'E'} för att sova. Då går natten fortare och du får tillbaka hjärtan. Bygg ett camp med eld och tält!<br>
      💡 Ibland slocknar lampan... då springer anomalierna fortare. Hör du steg? Vänd dig om!<br>
      👮 De riktiga säkerhetsvakterna är snälla och kan ge dig ett plåster. Men vissa vakter är <b>ANOMALIER</b>! Titta noga: röda ögon, huvudet bak och fram, för lång, inget ansikte, jättelånga armar, svävar i luften eller röd ficklampa. Skjut anomalierna, men skjut INTE de riktiga vakterna!<br>
      👫 Spelar ni flera? Blir man tagen blir man ett spöke 👻. Ni vinner om minst en av er överlever till 06:00!
    </div>`);
  $('goBtn') && ($('goBtn').onclick = start);
  $('leaveBtn') && ($('leaveBtn').onclick = () => { leaveNet(); netMsg = ''; menu(); });
  if ($('nameIn')) $('nameIn').oninput = e => {
    myName = e.target.value.replace(/[<>]/g, '').trim().slice(0, 12) || 'Spelare';
    p.name = myName; save0.name = myName; storeSave(save0);
  };
  if ($('hostBtn')) $('hostBtn').onclick = hostRoom;
  if ($('joinBtn')) $('joinBtn').onclick = () => joinRoom(($('codeIn').value || '').trim().toUpperCase());
}
function start() {
  if (mode === 'guest') return;
  hide(); state = 'play'; beep(440, .05);
  if (!isTouch) lockMouse();
  if (mode === 'host') {
    others.forEach(q => sendTo(q.id, worldFor(q)));
    sendAll(buildsMsg()); sendAll({ t:'start' }); sendAll(snapshot());
  }
}

// ===== Spel-loop =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  render(now, dt);
  if (state === 'play') updateHud();
  requestAnimationFrame(loop);
}
menu();
requestAnimationFrame(loop);
// För testning
window.__game = { get state() { return state; }, get p() { return p; }, get list() { return list; }, get guards() { return guards; },
  get chests() { return chests; }, set yaw(v) { yaw = v; }, get yaw() { return yaw; }, keys, grid, update, render, menu, start, shoot,
  set night(v) { night = v; }, get time() { return time; }, get anomaliesStopped() { return anomaliesStopped; }, get nightLen() { return nightLen; },
  build, interact, get fires() { return fires; }, get barricades() { return barricades; }, get ladders() { return ladders; }, get tents() { return tents; },
  get mode() { return mode; }, get others() { return others; }, get roomCode() { return roomCode; }, hostRoom, joinRoom, leaveNet, hurt };
</script>
