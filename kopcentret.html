<!DOCTYPE html>

<style>
  :root { --bg:#0b0820; --neon:#00e5ff; --pink:#ff3df0; --gold:#ffd23f; --green:#45ff8a; --red:#ff4d6d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden;

  #toast { position:fixed; left:50%; bottom:16%; transform:translateX(-50%); font-size:22px; font-weight:bold; width:90vw;

  #hint { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.7); padding:12px 20px;

  #cross { position:fixed; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; border:2px solid rgba(255,255,255,.6); pointer-events:none; }

  .note { background:#fff8c9; color:#333; border-radius:6px; padding:10px 14px; text-align:left; min-width:150px;
    transform:rotate(-2deg); box-shadow:3px 4px 0 rgba(0,0,0,.4); font-size:16px; }
  .note:nth-child(2) { transform:rotate(2deg); background:#d6f5ff; }

  .btn { font:inherit; font-size:20px; font-weight:bold; padding:12px 26px; margin:6px; border:none; border-radius:14px; cursor:pointer;
    background:var(--green); color:#0b0820; box-shadow:0 5px 0 #1b9c4e; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #1b9c4e; }
  .btn.alt { background:var(--neon); box-shadow:0 5px 0 #0089a0; }

<script type="module">
import * as THREE from 'three';

// ===== Karta (i rutor) =====
const MW = 36, MH = 26;
const SHOPS = [
  { name:'Mataffären', sign:'🛒', x0:0,  y0:0,  x1:12, y1:9,  door:[6,9],   floor:'#cfe8cf', shelves:true,
    items:[['🥛','Mjölk'],['🍌','Bananer'],['🧀','Ost'],['🥚','Ägg'],['🍝','Pasta'],['🥕','Morötter'],['🍎','Äpplen'],['🧈','Smör'],['🧻','Toapapper'],['🥒','Gurka']] },
  { name:'Apoteket', sign:'💊', x0:12, y0:0,  x1:20, y1:9,  door:[16,9],  floor:'#d8f0ea', shelves:true,
    items:[['🩹','Plåster'],['🪥','Tandborste'],['🧴','Solkräm'],['💊','Vitaminer'],['🧼','Tvål']] },
  { name:'Leksaker', sign:'🧸', x0:20, y0:0, x1:28, y1:9, door:[24,9], floor:'#f5d9ef', shelves:true,
    items:[['🧸','Nalle'],['🎲','Tärningar'],['🪀','Jojo'],['🧩','Pussel'],['🎈','Ballonger']] },
  { name:'Elektronik', sign:'🔌', x0:28, y0:0,  x1:35, y1:9,  door:[31,9],  floor:'#d9dcf5', shelves:true,
    items:[['🔋','Batterier'],['💡','Glödlampa'],['🎧','Hörlurar'],['🔌','Sladd']] },
  { name:'Kläder', sign:'👕', x0:0,  y0:16, x1:10, y1:25, door:[5,16],  floor:'#f5e3cf', shelves:true,
    items:[['🧦','Strumpor'],['🧢','Keps'],['🧤','Vantar'],['👕','T-shirt'],['🧣','Halsduk']] },
  { name:'Kiosken', sign:'🌭', x0:10, y0:16, x1:20, y1:25, door:[14,16], floor:'#fff1c2', shelves:false, items:[] },
  { name:'Toaletten', sign:'🚽', x0:20, y0:16, x1:25, y1:25, door:[22,16], floor:'#dff3ff', shelves:false, items:[] },
  { name:'Sport', sign:'⚽', x0:25, y0:16, x1:35, y1:25, door:[30,16], floor:'#e1f5d0', shelves:true,
    items:[['⚽','Fotboll'],['🎾','Tennisbollar'],['🏓','Pingisbollar'],['🪁','Drake'],['🕶️','Solglasögon']] },
];
const BOO_LINES = ['BÖÖ!', 'Stanna och lek...', 'Du får aldrig gå hem!', 'Jag ser dig...', 'Vill du prova kläder?!'];
const GUARD_HELLO = ['Hej! Allt lugnt?', 'Akta dig för skyltdockorna!', 'Konstigt ställe på natten, va?', 'Jag håller utkik!'];
const ANOMALIES = ['ögon', 'baklänges', 'lång', 'ansikte', 'armar', 'svävar', 'lampa'];
const CHARGER = { x:34, y:8 };
const TOILETS = [[21, 21], [24, 21], [21, 24], [24, 24]];

const grid = [], room = [], slotPos = [];
for (let y = 0; y < MH; y++) { grid.push(new Array(MW).fill(0)); room.push(new Array(MW).fill(-1)); }
SHOPS.forEach((s, id) => {
  for (let y = s.y0; y <= s.y1; y++) for (let x = s.x0; x <= s.x1; x++) {
    if (x === s.x0 || x === s.x1 || y === s.y0 || y === s.y1) grid[y][x] = 1; else room[y][x] = id;
  }
});
for (let y = 10; y <= 15; y++) { grid[y][0] = 1; grid[y][MW - 1] = 1; }
grid[12][0] = 3; grid[13][0] = 3; // låst utgång
SHOPS.forEach(s => { grid[s.door[1]][s.door[0]] = 0; grid[s.door[1]][s.door[0] + 1] = 0; });
SHOPS.forEach((s, id) => {
  slotPos[id] = [];
  if (!s.shelves) return;
  [s.y0 + 3, s.y0 + 6].forEach(sy => {
    for (let x = s.x0 + 2; x <= s.x1 - 2; x++) grid[sy][x] = 2;
    for (let x = s.x0 + 2; x <= s.x1 - 2; x += 2) { slotPos[id].push([x, sy - 1, 1]); slotPos[id].push([x, sy + 1, -1]); }
  });
});
for (let x = 12; x <= 18; x++) grid[20][x] = 2; // kioskdisk
grid[23][13] = 2; grid[23][17] = 2;
TOILETS.forEach(([x, y]) => grid[y][x] = 4);

// ===== Hjälpfunktioner =====
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
function loadSave() { try { return JSON.parse(localStorage.getItem('nils_kopcentret_v1')) || {}; } catch (e) { return {}; } }
function storeSave(d) { try { localStorage.setItem('nils_kopcentret_v1', JSON.stringify(d)); } catch (e) {} }
function solid(x, y) {
  const tx = Math.floor(x), ty = Math.floor(y);
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return true;
  const g = grid[ty][tx];
  return g === 1 || g === 2 || g === 3;
}
const walkable = (x, y) => grid[y] && (grid[y][x] === 0 || grid[y][x] === 4);
const hits = (x, y, r) => solid(x - r, y - r) || solid(x + r, y - r) || solid(x - r, y + r) || solid(x + r, y + r);
function moveBody(o, dx, dy, r) {
  let bx = false, by = false;
  const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / .12) || 1;
  for (let i = 0; i < steps; i++) {
    if (!bx) { if (!hits(o.x + dx / steps, o.y, r)) o.x += dx / steps; else bx = true; }
    if (!by) { if (!hits(o.x, o.y + dy / steps, r)) o.y += dy / steps; else by = true; }
  }
  return { bx, by };
}
function lineOfSight(ax, ay, bx, by) {
  const n = Math.ceil(dist(ax, ay, bx, by) / .2);
  for (let i = 1; i < n; i++) {
    const g = grid[Math.floor(ay + (by - ay) * i / n)][Math.floor(ax + (bx - ax) * i / n)];
    if (g === 1 || g === 2) return false;
  }
  return true;
}
function farTile(minD) {
  for (let i = 0; i < 400; i++) {
    const x = rand(1, MW - 1) | 0, y = rand(1, MH - 1) | 0;
    if (walkable(x, y) && dist(x + .5, y + .5, p.x, p.y) > minD) return [x + .5, y + .5];
  }
  return [33.5, 12.5];
}

// ===== Ljud =====
let AC = null;
function beep(f, dur = .12, type = 'square', vol = .08, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, f + slide), AC.currentTime + dur);
    g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  pick() { beep(660, .08); setTimeout(() => beep(990, .12), 70); },
  chest() { [392, 523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, .12, 'triangle', .1), i * 70)); },
  bang() { beep(160, .18, 'sawtooth', .2, -130); beep(900, .05, 'square', .12, -700); },
  empty() { beep(1300, .03, 'square', .06); },
  poof() { beep(600, .35, 'sine', .1, -500); },
  hit() { beep(180, .25, 'sawtooth', .1, -120); },
  creak() { beep(90, .9, 'sawtooth', .06, -40); },
  step(v) { beep(1600, .03, 'square', v); setTimeout(() => beep(1100, .03, 'square', v * .7), 60); },
  heart() { beep(55, .12, 'sine', .25); setTimeout(() => beep(50, .12, 'sine', .2), 160); },
  scream() { beep(900, .5, 'sawtooth', .14, -600); beep(1250, .4, 'square', .07, -900); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .2, 'triangle', .1), i * 130)); },
  lose() { [400, 300, 200].forEach((f, i) => setTimeout(() => beep(f, .25, 'sawtooth', .08), i * 180)); },
};

// ===== 3D-värld =====
const T = 2, WALL_H = 3.2, EYE = 1.55;
const cv = $('c');
const renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 3, 24);
const camera = new THREE.PerspectiveCamera(72, 1, .05, 100);
camera.rotation.order = 'YXZ';
scene.add(camera);
const amb = new THREE.AmbientLight(0x6a5a99, .5);
scene.add(amb);
const flash = new THREE.SpotLight(0xfff0cc, 30, 20, .5, .45, 1);
flash.position.set(.25, -.25, 0);
flash.target.position.set(0, -.3, -1);
camera.add(flash); camera.add(flash.target);
const muzzle = new THREE.PointLight(0xffaa44, 0, 10, 1);
muzzle.position.set(.3, -.2, -.6); camera.add(muzzle);
function lockMouse() { try { const r = cv.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const texCache = {};
function emojiTex(e) {
  if (texCache[e]) return texCache[e];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.font = '100px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(e, 64, 72);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return texCache[e] = t;
}
function sprite(e, s = 1) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:emojiTex(e), transparent:true }));
  sp.scale.set(s, s, s); return sp;
}
function signMesh(text) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(25,8,50,.95)'; x.fillRect(0, 0, 512, 128);
  x.strokeStyle = '#ff3df0'; x.lineWidth = 8; x.strokeRect(4, 4, 504, 120);
  x.font = 'bold 60px "Trebuchet MS","Segoe UI Emoji",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = '#ff3df0'; x.shadowBlur = 18; x.fillStyle = '#ffd6fb'; x.fillText(text, 256, 68);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(2.6, .65), new THREE.MeshBasicMaterial({ map:t, transparent:true }));
}

// Statisk värld: väggar, hyllor, golv, tak, skyltar
(function buildStatic() {
  const walls = [], shelves = [], floors = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const g = grid[y][x];
    if (g === 1) walls.push([x, y]); else if (g === 2) shelves.push([x, y]);
    if (g !== 1) floors.push([x, y]);
  }
  const m4 = new THREE.Matrix4();
  const wallMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(T, WALL_H, T),
    new THREE.MeshStandardMaterial({ color:0x8a7fa3, roughness:.95 }), walls.length);
  walls.forEach(([x, y], i) => wallMesh.setMatrixAt(i, m4.makeTranslation((x + .5) * T, WALL_H / 2, (y + .5) * T)));
  scene.add(wallMesh);
  const shelfMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(T * .98, 1.8, T * .75),
    new THREE.MeshStandardMaterial({ color:0x7a5535, roughness:.8 }), shelves.length);
  shelves.forEach(([x, y], i) => {
    const h = room[y][x] === 5 ? 1.1 : 1.8;
    shelfMesh.setMatrixAt(i, m4.compose(new THREE.Vector3((x + .5) * T, h / 2, (y + .5) * T), new THREE.Quaternion(), new THREE.Vector3(1, h / 1.8, 1)));
  });
  scene.add(shelfMesh);
  const floorGeo = new THREE.PlaneGeometry(T, T); floorGeo.rotateX(-Math.PI / 2);
  const floorMesh = new THREE.InstancedMesh(floorGeo, new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.6 }), floors.length);
  const col = new THREE.Color();
  floors.forEach(([x, y], i) => {
    floorMesh.setMatrixAt(i, m4.makeTranslation((x + .5) * T, 0, (y + .5) * T));
    const r = room[y][x];
    col.set(r >= 0 ? SHOPS[r].floor : ((x + y) % 2 ? '#bdb6a6' : '#aaa393'));
    floorMesh.setColorAt(i, col);
  });
  scene.add(floorMesh);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(MW * T, MH * T), new THREE.MeshStandardMaterial({ color:0x1c1828 }));
  ceil.rotation.x = Math.PI / 2; ceil.position.set(MW * T / 2, WALL_H, MH * T / 2);
  scene.add(ceil);
  SHOPS.forEach(s => {
    const m = signMesh(`${s.sign} ${s.name}`);
    const top = s.door[1] === 9;
    m.position.set((s.door[0] + 1) * T, 2.75, top ? 10 * T + .02 : 16 * T - .02);
    if (!top) m.rotation.y = Math.PI;
    scene.add(m);
  });
  const exitSign = signMesh('🔒 LÅST TILL 06:00');
  exitSign.rotation.y = Math.PI / 2; exitSign.position.set(T + .02, 2.75, 13 * T);
  scene.add(exitSign);
  const door = new THREE.Mesh(new THREE.BoxGeometry(.2, WALL_H, T * 2), new THREE.MeshStandardMaterial({ color:0x8a2030, emissive:0x400010 }));
  door.position.set(1.9, WALL_H / 2, 13 * T); scene.add(door);
  TOILETS.forEach(([x, y]) => { const s = sprite('🚽', .9); s.position.set((x + .5) * T, .5, (y + .5) * T); scene.add(s); });
  [['🌭', 12], ['🍦', 15], ['🥤', 18]].forEach(([e, x]) => { const s = sprite(e, .6); s.position.set((x + .5) * T, 1.45, 20.5 * T); scene.add(s); });
  const ch = sprite('🔋', 1); ch.position.set((CHARGER.x + .5) * T, 1.1, (CHARGER.y + .5) * T); scene.add(ch);
  const chl = new THREE.PointLight(0x44ff88, 3, 5, 1); chl.position.set((CHARGER.x + .5) * T, 1.5, (CHARGER.y + .5) * T); scene.add(chl);
})();

// ===== Modeller =====
const mannequinMat = new THREE.MeshStandardMaterial({ color:0xeadfcd, roughness:.5 });
const eyeMat = new THREE.MeshBasicMaterial({ color:0xff1a3a, fog:false });
function makeMannequin() {
  const g = new THREE.Group();
  const add = (geo, x, y, z, rz = 0) => { const m = new THREE.Mesh(geo, mannequinMat); m.position.set(x, y, z); m.rotation.z = rz; g.add(m); return m; };
  add(new THREE.CylinderGeometry(.2, .27, .95, 10), 0, 1.2, 0);
  add(new THREE.CylinderGeometry(.08, .06, .8, 8), -.11, .4, 0);
  add(new THREE.CylinderGeometry(.08, .06, .8, 8), .11, .4, 0);
  add(new THREE.CylinderGeometry(.06, .045, .8, 8), -.34, 1.2, 0, -.18);
  add(new THREE.CylinderGeometry(.06, .045, .8, 8), .34, 1.2, 0, .18);
  add(new THREE.CylinderGeometry(.06, .07, .15, 8), 0, 1.72, 0);
  const head = add(new THREE.SphereGeometry(.17, 14, 12), 0, 1.9, 0); head.scale.y = 1.25;
  [-.06, .06].forEach(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(.028, 8, 6), eyeMat); e.position.set(x, 1.93, .15); g.add(e); });

  flowT -= dt; if (flowT <= 0) { flowT = .25; computeFlow(); }

  // Vakter: riktiga är snälla, anomalier anfaller
  for (const g of guards) {
    if (g.dead) continue;
    g.cd -= dt;
    const d = dist(g.x, g.y, p.x, p.y);
    if (g.cd <= 0 && d < 5 && lineOfSight(g.x, g.y, p.x, p.y)) {
      if (d > (g.anomaly ? .6 : 1.3)) g.face = chase(g, g.anomaly ? 1.9 : 1.5, dt, .3);
      else if (g.anomaly) { attack(g, 'Hehehe... jag är ingen riktig vakt!'); g.cd = 12; [g.x, g.y] = farTile(10); }
      else {
        g.face = Math.atan2(p.x - g.x, p.y - g.y);
        let msg = pick(GUARD_HELLO);
        if (!g.gave) {
          g.gave = true;
          if (hasGun) { ammo += 5; msg += ' Här, ta lite skott! +5 🔫'; }
          else { battery = 100; msg += ' Här, ta nya batterier! 🔦'; }
          sfx.pick();
        }
        toast('👮 ' + msg, '#9fd0ff', 2.5); g.cd = 15;
      }
    } else g.face = wander(g, 1.1, dt);
  }

  // Skyltdockor: rör sig bara när du inte tittar!
  let nearest = 99;
  for (const m of mannequins) {
    if (m.dead > 0) {
      m.dead -= dt;
      if (m.dead <= 0) { [m.x, m.y] = farTile(12); m.mesh.visible = true; m.cd = 2; }
      continue;
    }
    m.cd -= dt;
    m.seen = canSee(m);
    const d = dist(m.x, m.y, p.x, p.y);
    if (!m.seen) nearest = Math.min(nearest, d);
    if (m.seen || m.cd > 0) continue;
    const sp = blackout > 0 ? 2.5 : 1.2 + night * .12;
    chase(m, sp, dt);
    m.face = Math.atan2(p.x - m.x, p.y - m.y);
    if (d < 8) { m.stepT -= dt; if (m.stepT <= 0) { m.stepT = blackout > 0 ? .2 : .5; sfx.step((8 - d) / 8 * .07); } }
    if (d < .6) { attack(m, pick(BOO_LINES)); [m.x, m.y] = farTile(12); m.cd = 4; if (state !== 'play') return; }
  }
  if (nearest < 4) { heartT -= dt; if (heartT <= 0) { heartT = nearest < 2 ? .5 : .85; sfx.heart(); } }
}

function attack(who, line) {
  lives--; sfx.scream(); shake = .6;
  $('scare').style.display = 'flex';
  toast(line, '#ff4d6d', 2);
  mannequins.forEach(o => o.cd = Math.max(o.cd, 4));
  guards.forEach(o => { if (o.anomaly) o.cd = Math.max(o.cd, 3); });
  if (lives <= 0) { state = 'dying'; setTimeout(() => { $('scare').style.display = 'none'; lose(); }, 1100); }
  else setTimeout(() => $('scare').style.display = 'none', 700);
}

// ===== Rita =====
const mini = $('mini'), mctx = mini.getContext('2d');
function render(now, dt) {
  const sx = shake > 0 ? rand(-.08, .08) : 0, sy = shake > 0 ? rand(-.08, .08) : 0;
  shake = Math.max(0, shake - dt);
  camera.position.set(p.x * T + sx, EYE + Math.sin(bob) * .05 + sy, p.y * T);
  camera.rotation.set(pitch, yaw, 0);
  const flick = battery < 20 && Math.random() < .15 ? .3 : 1;
  flash.intensity = blackout > 0 ? 0 : 30 * flick;
  flash.distance = lightRange() * T * 1.4;
  amb.intensity = blackout > 0 ? .03 : .5;
  muzzle.intensity = Math.max(0, muzzle.intensity - dt * 300);
  for (const m of mannequins) { m.mesh.position.set(m.x * T, 0, m.y * T); m.mesh.rotation.y = m.face; }
  for (const g of guards) {
    g.mesh.position.set(g.x * T, 0, g.y * T);
    g.mesh.rotation.y = g.face;
    g.mesh.children[0].position.y = (g.anomaly === 'svävar' ? .45 + Math.sin(now / 400) * .1 : 0);
  }
  for (const r of robots) { r.mesh.position.set(r.x * T, 0, r.y * T); r.mesh.rotation.y = r.face || 0; }
  for (const c of carts) {
    c.mesh.position.set(c.x * T, 0, c.y * T);
    c.mesh.userData.ghost.position.y = 1.6 + Math.sin(now / 200 + c.y) * .12;
  }
  for (const c of chests) if (!c.open) c.mesh.userData.sparkle.position.y = 1 + Math.sin(now / 300 + c.x) * .1;
  const pulse = 1 + Math.sin(now / 250) * .12;
  list.forEach(l => { if (!l.got) l.slot.sprite.scale.setScalar(.8 * pulse); });
  renderer.render(scene, camera);
  drawMinimap(now);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').style.opacity = 0; }
  $('hint').style.display = state === 'play' && !isTouch && document.pointerLockElement !== cv ? 'block' : 'none';
  kick = Math.max(0, kick - dt * 6);
  const gun = $('gun');
  gun.style.display = state === 'play' && hasGun ? 'block' : 'none';
  gun.style.transform = `translate(${-kick * 20}px, ${Math.sin(bob) * 8 + kick * 30}px) scaleX(-1) rotate(${-10 - kick * 25}deg)`;
  $('shootBtn').style.display = isTouch && state === 'play' && hasGun ? 'flex' : 'none';
}

function drawMinimap(now) {
  const m = innerWidth < 600 ? 3 : 4;
  if (mini.width !== MW * m) { mini.width = MW * m; mini.height = MH * m; }
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const g = grid[y][x], r = room[y][x];
    mctx.fillStyle = g === 1 ? '#2a2250' : g === 2 ? '#6b4a2e' : g === 3 ? '#8a2b3c' : r >= 0 ? SHOPS[r].floor : '#888';
    mctx.fillRect(x * m, y * m, m, m);
  }
  if (Math.sin(now / 150) > 0) {
    mctx.fillStyle = '#ff9d00';
    list.forEach(l => { if (!l.got) mctx.fillRect(l.slot.tx * m - 1, l.slot.ty * m - 1, m + 2, m + 2); });
  }
  mctx.fillStyle = '#44ff88'; mctx.fillRect(CHARGER.x * m, CHARGER.y * m, m, m);
  const px = p.x * m, py = p.y * m;
  mctx.strokeStyle = '#ff3df0'; mctx.lineWidth = 2;
  mctx.beginPath(); mctx.moveTo(px, py); mctx.lineTo(px - Math.sin(yaw) * m * 2.5, py - Math.cos(yaw) * m * 2.5); mctx.stroke();
  mctx.fillStyle = '#ff3df0'; mctx.beginPath(); mctx.arc(px, py, m * .9, 0, 7); mctx.fill();
}

// ===== HUD och listor =====
function renderList() {
  const part = who => list.filter(l => l.who === who).map(l => `<div class="it ${l.got ? 'got' : ''}">${l.slot.e} ${l.slot.name}</div>`).join('');
  const left = list.filter(l => !l.got).length;
  $('list').innerHTML = `<b>📝 Inköpslistan (${list.length - left}/${list.length})</b><div class="items">
    <h3>👩 Mamma</h3>${part('mamma')}<h3>👨 Pappa</h3>${part('pappa')}</div>
    ${left ? '' : '<div style="color:#45ff8a;margin-top:6px"><b>Klart! ⭐</b></div>'}`;
}
function clockText() {
  const mins = (20 * 60 + Math.floor(time / nightLen * 600)) % (24 * 60);
  return `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
}
function updateHud() {
  $('lvl').textContent = night;
  $('clock').textContent = '🕛 ' + clockText();
  $('clock').className = nightLen - time < 25 ? 'warn' : '';
  const e = clamp(battery, 0, 100);
  $('eBar').style.width = e + '%'; $('eBar').style.background = e < 25 ? '#ff4d6d' : '#ffd23f';
  $('lives').textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
  $('ammo').textContent = hasGun ? `🔫 ${ammo}` : '';
}

// ===== Skärmar =====
function show(html) { $('screen').innerHTML = `<div class="box">${html}</div>`; $('screen').classList.remove('hidden'); if (document.pointerLockElement) document.exitPointerLock(); }
function hide() { $('screen').classList.add('hidden'); }
function notes() {
  const n = who => list.filter(l => l.who === who).map(l => `${l.slot.e} ${l.slot.name}`).join('<br>');
  return `<div class="notes"><div class="note"><b>👩 Mammas lista</b>${n('mamma')}</div><div class="note"><b>👨 Pappas lista</b>${n('pappa')}</div></div>`;
}
function menu() {
  state = 'menu'; setupNight(); updateHud();
  const best = save0.best ? `<p>🏆 Ditt rekord: natt ${save0.best}</p>` : '';
  const ctrl = isTouch
    ? '🎮 Dra med vänster tumme för att gå, dra med höger tumme för att titta. Skjut med 💥-knappen.'
    : '🎮 Gå med WASD, titta med musen (klicka först). Skjut med vänster musknapp eller mellanslag. Esc släpper musen.';
  show(`<h1>🌙 Natt ${night}</h1>
    <p>Oj nej! Du blev inlåst i köpcentret! Mamma och pappa kan hämta dig först klockan <b>06:00</b>. Överlev natten! Hinner du handla allt på listan får du en extra stjärna.</p>
    ${notes()}${best}
    <button class="btn" id="goBtn">Starta natten 🔦</button>
    <div class="tips">
      ${ctrl}<br>
      🧰 Leta efter kistor i affärerna! Där finns pistoler, skott, batterier och extra hjärtan.<br>
      🧍 Skyltdockorna rör sig bara när du INTE tittar på dem. Men ibland slocknar lampan...<br>
      👮 De riktiga säkerhetsvakterna är snälla och ger dig saker. Men vissa vakter är <b>ANOMALIER</b>! Titta noga: röda ögon, huvudet bak och fram, för lång, inget ansikte, jättelånga armar, svävar i luften eller röd ficklampa. Skjut anomalierna, men skjut INTE de riktiga vakterna!<br>
      🔦 Ladda ficklampan vid 🔋 laddstationen i Elektronik.
    </div>`);
  $('goBtn').onclick = start;
}
function start() {
  hide(); state = 'play'; beep(440, .05);
  if (!isTouch) lockMouse();
}
function lose() {
  state = 'over'; sfx.lose();
  show(`<h1>🧍 Du klarade inte natten!</h1><p>Klockan var ${clockText()} när monstren tog dig. Nu står du i skyltfönstret och poserar i en jättefin kostym... Försök igen!</p>
    <p>Du stoppade ${anomaliesStopped} anomali${anomaliesStopped === 1 ? '' : 'er'} och hittade ${list.filter(l => l.got).length} av ${list.length} saker.</p>
    <button class="btn" id="goBtn">Försök igen 🔁</button>`);
  $('goBtn').onclick = menu;
}
function dawn() {
  state = 'over'; sfx.win();
  const listDone = list.every(l => l.got);
  const stars = 1 + (listDone ? 1 : 0) + (lives === 3 ? 1 : 0);
  save0.best = Math.max(save0.best || 0, night + 1); storeSave(save0);
  show(`<h1>☀️ Klockan är 06:00!</h1><h2 style="margin:0;color:#45ff8a">Du överlevde natt ${night}!</h2>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <p>Lamporna tänds och mamma och pappa låser upp dörren. Puh! ${listDone ? 'Och du handlade ALLT på listan! 🛒' : ''}</p>
    <p>🎯 Anomalier stoppade: ${anomaliesStopped}</p>
    <p>Nästa natt blir längre och läskigare...</p>
    <button class="btn" id="goBtn">Nästa natt 🌙</button>
    <button class="btn alt" id="againBtn">Samma natt igen</button>`);
  $('goBtn').onclick = () => { night++; menu(); };
  $('againBtn').onclick = menu;
}

// ===== Spel-loop =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  render(now, dt);
  if (state === 'play') updateHud();
  requestAnimationFrame(loop);
}
menu();
requestAnimationFrame(loop);
// För testning
window.__game = { get state() { return state; }, get p() { return p; }, get list() { return list; }, get mannequins() { return mannequins; },
  get guards() { return guards; }, get chests() { return chests; }, set yaw(v) { yaw = v; }, get yaw() { return yaw; },
  keys, grid, update, render, menu, start, shoot, set night(v) { night = v; }, get lives() { return lives; }, get time() { return time; },
  get ammo() { return ammo; }, get hasGun() { return hasGun; }, get anomaliesStopped() { return anomaliesStopped; }, get nightLen() { return nightLen; } };
</script>
</body>
</html>
